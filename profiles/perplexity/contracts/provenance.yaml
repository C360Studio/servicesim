  # The entries below (the background lifecycle: issue #6's create, retrieve and 404, and
  # issue #31's cancel 200 and 400) carry the date of the 2026-10-01 audit, which read
  # retrieveAgent, cancelAgentResponse, the Status enum, ResponsesResponse and the
  # background description. The lifecycle operations were read again on 2026-10-03, and
  # cancelAgentResponse once more on 2026-10-04 against a fetch whose bytes are identical
  # to the 2026-10-03 copy. Every reading agrees with everything that audit recorded about
  # them, but the document's hash had moved (the spec: block above keeps the 2026-10-01
  # hash; the 2026-10-03 and 2026-10-04 fetches hashed 1a269d55…, see README.md "Dated note,
  # 2026-10-03" and "Dated note, 2026-10-04"), and dating an entry 2026-10-03 or
  # 2026-10-04 would force this file's provider-level verified: and spec: forward to a
  # document whose other entries have not been re-read. The sanctioned refresh procedure
  # (contracts/README.md) does that move after a whole-bundle re-read, not before it.
  - golden: perplexity-agent-background-queued.json
    endpoint: POST /v1/agent (aliases POST /v1/responses, POST /responses), background true
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    api_version: "1.0.0"
    verified: 2026-10-01
    note: >-
      The create of a background run, answered at once. Vendor-pinned:
      createAgent's 200 is ResponsesResponse
      (#/paths/~1v1~1agent/post/responses/200), whose required keys id,
      object, created_at, status, model and output are all present, and
      ResponsesRequest.background's description says a background request
      with stream false "returns immediately with status: queued"
      (#/components/schemas/ResponsesRequest/properties/background).
      Simulator-chosen: id is the job's own, "resp_" plus 32 hex characters
      derived from the scenario and the create's call index (the
      specification says only "resp_<...>"); output is empty because the run
      has not answered; model echoes the request's selection; created_at is
      the scenario's base time; and usage, optional in ResponsesResponse, is
      omitted rather than rendered as an invented zero. The spec's prose says
      to poll GET /v1/responses/{id}, a path the document does not declare;
      the retrieve served is GET /v1/agent/{id}.

  - golden: perplexity-agent-background-completed.json
    endpoint: GET /v1/agent/{id}
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    api_version: "1.0.0"
    verified: 2026-10-01
    note: >-
      A retrieve of a background run that has completed. retrieveAgent
      documents 200 ResponsesResponse (#/paths/~1v1~1agent~1{id}/get), so the
      status, the envelope and every field name are the specification's;
      the values are the scenario's scripted snapshot, rendered the way
      perplexity-agent-happy.json is. id is always the job's, never
      scripted. The message item's id derives from the job id, so it is
      stable across one job's retrieves. usage appears because this snapshot
      scripts it, with its cost; a snapshot that scripts neither renders no
      usage. Treating completed as terminal is Servicesim's policy: the
      Status enum has no terminal/non-terminal split.

  - golden: perplexity-agent-retrieve-404.json
    endpoint: GET /v1/agent/{id} (also POST /v1/agent/{id}/cancel)
    status: 404
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    api_version: "1.0.0"
    verified: 2026-10-01
    note: >-
      retrieveAgent documents 404 with {"error": ErrorInfo}
      (#/paths/~1v1~1agent~1{id}/get/responses/404): "Unknown id, or the
      response belongs to a different account, or the response was created
      with store: false". The status and the envelope are the
      specification's; the code and type values and the message text
      (http.StatusText) are Servicesim's. Served, claiming nothing, for an id
      this namespace never minted (another namespace stands in for another
      account), a store: false background create's id, and a synchronous
      response's id — the last is a deliberate divergence, since the real API
      retrieves a response stored by default and this simulator makes only
      background runs retrievable.
      The cancel's 404 is these same bytes, so it has no golden of its own.
      cancelAgentResponse documents 404 with the same {"error": ErrorInfo}
      (#/paths/~1v1~1agent~1{id}~1cancel/post/responses/404): "Unknown id, or
      the response belongs to a different account." (no store: false clause).
      The profile serves it, claiming nothing, for the same three ids, and a
      test compares the cancel's 404 with this file after json.Compact (the
      file is pretty-printed, the wire is compact).

  - golden: perplexity-agent-cancel-200.json
    endpoint: POST /v1/agent/{id}/cancel
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    api_version: "1.0.0"
    verified: 2026-10-01
    note: >-
      The acknowledgement of a cancel. cancelAgentResponse documents 200 as an
      object whose required keys are response_id and status
      (#/paths/~1v1~1agent~1{id}~1cancel/post/responses/200), whose only
      properties they are, and whose status is a string with exactly one enum
      member, cancelling: "Always `cancelling` - the cancel was accepted and
      the run stops asynchronously. An already-terminal run returns `400`
      instead, so no terminal status appears here." The keys, the status value
      and the absence of anything else (no snapshot, unlike Exa's cancel) are
      the specification's. Simulator-chosen: response_id is the job's own id,
      "resp_" plus 32 hex characters, which the specification describes only
      as "The response id (`resp_<...>`)"; this file carries the id that
      perplexity-agent-background-queued.json is the create of. The operation
      declares no request body, so the profile reads none. When this body is
      served is SIMULATOR-POLICY, since the specification says only that a
      200 acknowledges a request and a terminal run is a 400: the first
      cancel of a run whose next retrieve is pending always answers it, even
      when the scenario's first cancel snapshot is itself terminal, and so
      does a repeat while the cancel script's next snapshot is pending. See
      README.md "The cancel".

  - golden: perplexity-agent-cancel-400.json
    endpoint: POST /v1/agent/{id}/cancel
    status: 400
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    api_version: "1.0.0"
    verified: 2026-10-01
    note: >-
      A cancel of a run that is already terminal. cancelAgentResponse
      documents 400 with {"error": ErrorInfo}
      (#/paths/~1v1~1agent~1{id}~1cancel/post/responses/400): "The response is
      already terminal, or the request is invalid.", and the operation's
      description says "Cancelling a run that is already terminal returns
      `400`." The status and the envelope are the specification's;
      ErrorInfo requires only message, and the envelope itself marks nothing
      required. The specification supplies no example body, so every value
      here is Servicesim's: code invalid_request and type invalid_request_error
      are the pair perplexity-agent-400.json uses, and the message is a plain
      sentence of the simulator's. Which cancels get it is SIMULATOR-POLICY:
      a cancel of a run whose next retrieve is already terminal (completion
      wins, and nothing is recorded), and a repeat once the cancel script's
      next snapshot is terminal. The 400's other documented cause, "the
      request is invalid", is not this body: a request body that is not a JSON
      object is refused with the Agent validation 400, as on every route.

  - golden: perplexity-sonar-stream.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_mode full
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Full-mode GrammarDelta transcript for a three-delta turn (Phase 5 unit 1,
      docs/design/streaming.md §7 "Resolved 2026-08-15" A3). Vendor-pinned:
      unnamed data: frames, object: chat.completion.chunk, choices[0].index,
      finish_reason present (null on every non-terminal chunk, the scripted
      value on the terminal one), that every chunk carries both delta and the
      server-side-aggregated message, usage.cost's field names, and — via
      declared OpenAI compatibility only, not a direct Sonar statement — the
      data: [DONE] sentinel. Simulator-chosen, correctable from a captured
      live response per docs/design/streaming.md §10 step 3: that usage rides
      on the SAME chunk as finish_reason and search_results (the vendor
      confirms this placement only for stream_mode: concise, on
      chat.reasoning.done/chat.completion.done); that id stays constant while
      created is pinned constant at time.base rather than moving the way the
      vendor's own concise-mode example shows it (a deliberate departure, not
      an extension, so this golden stays byte-stable); that search_results
      repeats on every chunk rather than only the terminal one (the vendor
      states "multiple times during stream" without saying which); and that
      finish_reason: null specifically for full mode (inferred from the
      concise-mode example, unstated for full mode by any fetched page). No
      citations: none appear in any fetched vendor streaming frame. The two
      response headers this golden's request would receive on the real wire
      — Content-Type: text/event-stream and Cache-Control: no-cache — are
      also simulator-chosen, not vendor-pinned: no fetched page or the
      openapi.json document states either header for this surface (the
      OpenAPI document declares no text/event-stream content type at all for
      /v1/sonar, per this file's own "Streaming (SSE)" section above).

  - golden: perplexity-sonar-stream-disconnect.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_disconnect fault
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Phase 5 unit 2 (docs/design/streaming.md §9). The same three-delta turn
      as perplexity-sonar-stream.sse, scripted with `fault: {attempts:
      [{kind: stream_disconnect, after_chunk: 2, reset: true}]}`. The
      transcript is exactly chunk 0 and chunk 1's frames, byte-identical to
      the first two frames of perplexity-sonar-stream.sse — stream_disconnect
      aborts BEFORE writing the chunk at AfterChunk, so chunk 2 (the third
      delta) and the terminal chunk never reach the wire at all, not even
      partially: the RST lands at a clean frame boundary, which is the
      distinction from the truncate-chunk golden below. Entirely
      simulator-chosen: no vendor page documents a disconnect transcript.

  - golden: perplexity-sonar-stream-truncate.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_truncate_chunk fault
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Phase 5 unit 2 (docs/design/streaming.md §9). The same three-delta turn
      as perplexity-sonar-stream.sse, scripted with `fault: {attempts:
      [{kind: stream_truncate_chunk, after_chunk: 1, truncate_after_bytes:
      40}]}`. The transcript is chunk 0's frame in full, byte-identical to
      perplexity-sonar-stream.sse's first frame, followed by exactly the
      first 40 bytes of chunk 1's frame — a malformed, mid-object "data:"
      line with no terminating blank line — then the connection dies.
      Deliberately NOT a clean frame boundary, unlike the disconnect golden
      above: that distinction is the entire reason this fault kind exists
      rather than reusing stream_disconnect. Entirely simulator-chosen: no
      vendor page documents a truncated-frame transcript.

  - golden: perplexity-agent-stream.sse
