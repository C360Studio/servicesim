# Provenance for the Perplexity golden wire fixtures.
#
# Every golden in this directory has exactly one entry here, and
# contracts/contracts_test.go fails the build if that stops being true.
#
# Two `verified:` dates live in this file, and they answer different questions:
#   - the top-level one (below) is when THIS PROVIDER'S CONTRACT AS A WHOLE was
#     last verified, and must match contracts/README.md's index-table Verified
#     column for perplexity.
#   - each entry's own `verified:` is when THAT GOLDEN'S SHAPE was last checked
#     against its documentation_url. Refreshing one fixture moves only its own
#     date; it does not imply every other entry was re-checked, and the test
#     suite no longer requires them all to agree.
# The 2026-10-01 refresh re-read the Agent surface only (docs/audits/
# 2026-10-01-perplexity-agent.md): every Agent entry was re-dated except
# perplexity-agent-stream.sse, whose documentation_url is a prose page that was
# not re-read, and the Sonar and routing entries were not re-read at all, so
# those keep their own dates. The top-level date moved with the re-dated
# Agent entries, as contracts/README.md's
# refresh procedure requires, so today it records the most recent re-check of
# ANY entry, not a re-read of every route.
#
# kind:
#   vendor-documented  the shape AND the values come from the vendor's own
#                      machine-readable specification.
#   simulator-chosen   Servicesim picked this shape or these values. A dated
#                      re-verification (contracts/README.md "Keeping them
#                      honest") may correct it from a real response — there is
#                      no live contract canary.
#
# For an error golden the rule is: vendor-documented when the specification
# documents both the STATUS and the envelope SHAPE for that operation;
# simulator-chosen when it documents either not at all. The strings inside a
# vendor-documented error body (code, type, message text) are Servicesim's
# unless the specification quotes them, and the entry's note says which.
#
# Unlike Exa and Tavily, this provider's contract was generated directly from
# https://docs.perplexity.ai/openapi.json rather than from prose pages, so
# "vendor-documented" here means "named in that specification". README.md in
# this directory is the authority and must not be edited by fixture work.
#
# Sonar is supported only until 2026-09-27; the Agent API is its successor and
# both surfaces are simulated.

provider: perplexity
verified: 2026-10-01

