# Provenance for the Exa golden wire fixtures.
#
# Every golden in this directory has exactly one entry here, and
# contracts/contracts_test.go fails the build if that stops being true. The
# question a reviewer asks when a golden changes is "did the vendor change, or
# did we?", and it is unanswerable without a dated record of what the shape was
# checked against.
#
# Two `verified:` dates live in this file, and they answer different questions:
#   - the top-level one (below) is when THIS PROVIDER'S CONTRACT AS A WHOLE was
#     last verified, and must match contracts/README.md's index-table Verified
#     column for exa.
#   - each entry's own `verified:` is when THAT GOLDEN'S SHAPE was last checked
#     against its documentation_url. Refreshing one fixture moves only its own
#     date; it does not imply every other entry was re-checked, and the test
#     suite no longer requires them all to agree.
#
# kind:
#   vendor-documented  the shape AND the values come from the vendor's own
#                      documentation, quoted or directly derived from it.
#   simulator-chosen   Servicesim picked this shape or these values. A dated
#                      re-verification (contracts/README.md "Keeping them
#                      honest") may correct it from a real response — there is
#                      no live contract canary.
#
# The field names in every golden are governed by README.md in this directory,
# which is the authority and must not be edited by fixture work.
#
# spec: records the machine-readable specification Exa publishes,
# https://exa.ai/docs/exa-spec.yaml, covering every route this provider
# simulates (/search, /contents, /answer, /findSimilar, /agent/runs,
# /agent/runs/{id}, /agent/runs/{id}/cancel) — last fetched and hashed
# 2026-10-02, with the same hash as the 2026-10-01 fetch (see the dated notes
# below for what each fetch was read for). Its sha256 is the DRIFT
# SIGNAL for this provider: an unchanged hash on a fresh fetch means nothing
# below needs re-reading; a changed one means re-read the consumed fields
# against both the per-entry documentation_url pages below and the spec
# itself (contracts/README.md "Keeping them honest"), then update whatever
# changed.
#
# A changed spec.sha256 is not itself a diff of what this file consumes:
# most entries' documentation_url below is a rendered prose page, not the
# spec, and the spec's own bytes can move for reasons this provider's
# contract never touches (new webset/monitor endpoints, unrelated schema
# additions). The hash says "go re-read the pages", not "here is what
# changed" — the per-entry documentation_url and verified date remain the
# record of what was actually verified and against what. Only entries whose
# documentation_url IS the spec (the three /findSimilar entries and the twelve
# exa-agent-runs-* entries below: fifteen in all) carry api_version, because only
# those were read from this versioned document; every other entry was read from
# an undated prose page and carries none.
#
# 2026-10-01: the hash below was re-fetched and adopted after re-reading ONLY the
# /agent/runs surface against the spec (docs/audits/2026-10-01-exa-agent.md),
# which is why the six exa-agent-runs-* entries now cite the spec and carry
# api_version. The /search, /answer, /contents and /findSimilar entries were NOT
# re-read against this revision: they keep their earlier verified dates, and the
# provider-level date below moved only because contracts.Conform requires it to
# be no older than any entry: it reflects that rule, not a re-read of all seven
# routes this provider simulates, and neither does the Verified cell it must
# match in contracts/README.md. A re-read of those routes against this hash is
# still owed, tracked in GitHub issue #11, and nothing here claims it was done.
#
# 2026-10-02: the spec was re-fetched and its hash is IDENTICAL to the one
# adopted on 2026-10-01, so retrieved moved and sha256 did not. Only
# cancelAgentRun and stopAgentRun were read against it, for the four
# exa-agent-runs-cancel* entries it then had (exa-agent-runs-cancelled and the
# -cancel-401, -cancel-404 and -cancel-500; docs/audits/2026-10-01-exa-agent.md,
# "Cancel, 2026-10-02"); the provider-level date moved because contracts.Conform
# requires it to be no older than those entries, on the same terms as above.
# The exa-agent-runs-cancel-400 and -429 entries were added afterwards (issue #37)
# from this same reading of cancelAgentRun and carry its date; see the note above
# them.

provider: exa
verified: 2026-10-02

spec:
  url: https://exa.ai/docs/exa-spec.yaml
  version: "2.0.0"
  sha256: cbb9a1429456270527cec49cb495ec00671dd2b7702c411a168988e22222416d
  retrieved: 2026-10-02

goldens:
  - golden: exa-search-happy.json
    endpoint: POST /search
    status: 200
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/search
    verified: 2026-08-14
    note: >-
      Full result object. There is deliberately no score key: Exa's result
      schema has none and the only score-like field is highlightScores.
      costDollars is always present. Identifier values are Servicesim's derived
      ones; testkit.AssertGoldenJSON ignores requestId by default.

  - golden: exa-search-empty.json
    endpoint: POST /search
    status: 200
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/search
    verified: 2026-08-14
    note: >-
      Zero-result success. results stays an empty array rather than null, and
      costDollars stays present, because both are required by the schema.

  - golden: exa-search-structured.json
    endpoint: POST /search
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/search
    verified: 2026-08-14
    note: >-
      The outputSchema branch. output.content, output.grounding[].field,
      .citations and .confidence are documented field names, but the vendor
      does not enumerate the object shape inside grounding[].citations, so the
      {title, url, id} triple used here is Servicesim's choice.
      resolvedSearchType and context are documented but deprecated.

  - golden: exa-search-400.json
    endpoint: POST /search
    status: 400
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      Reproduced verbatim from the documentation. It doubles as proof of the
      exact type enum and of the flat {requestId, error, tag} envelope, which is
      not a nested {error: {code, message}}.

  - golden: exa-search-401.json
    endpoint: POST /search
    status: 401
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      Envelope and tag are documented; the message text is reconstructed. No
      verbatim 401 body appears in the vendor documentation.

  - golden: exa-search-402.json
    endpoint: POST /search
    status: 402
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      402 Payment Required is the only error status enumerated in the /search
      OpenAPI reference and it carries no body schema. NO_MORE_CREDITS is a
      documented tag; the message text is reconstructed.

  - golden: exa-search-422.json
    endpoint: POST /search
    status: 422
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/search-api-guide-for-coding-agents
    verified: 2026-08-14
    note: >-
      422 is listed as a documented status by the coding-agents guide; the body
      is not quoted anywhere, so the message text is reconstructed.

  - golden: exa-search-429.json
    endpoint: POST /search
    status: 429
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      Reproduced verbatim. Rate-limit responses use a REDUCED shape carrying
      error only, with no requestId and no tag. A simulator that always emitted
      the three-key envelope would be wrong for exactly the status retry logic
      depends on.

  - golden: exa-search-500.json
    endpoint: POST /search
    status: 500
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      INTERNAL_ERROR is a documented tag; the body is not quoted, so the message
      text is reconstructed.

  - golden: exa-search-404.json
    endpoint: any unmatched path on the Exa listener
    status: 404
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      Fail-closed routing. The envelope is the documented one; the NOT_FOUND tag
      value and the message are Servicesim's, so a consumer's error decoder does
      not have to special-case the simulator.

  - golden: exa-search-405.json
    endpoint: a known Exa path with an unsupported method
    status: 405
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-14
    note: >-
      Served with an Allow header. The METHOD_NOT_ALLOWED tag value is
      Servicesim's; the envelope is the documented one.

  - golden: exa-answer-happy.json
    endpoint: POST /answer
    status: 200
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/answer
    verified: 2026-08-14
    note: >-
      A distinct envelope, not a variant of /search: there is no results key,
      and the citation object is a strict subset of the search result (no
      highlights, highlightScores, summary, subpages, extras or entities, and no
      score anywhere). costDollars is optional here and its documented example
      carries total only, so the sparse form is the default.

  - golden: exa-answer-empty.json
    endpoint: POST /answer
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/answer
    verified: 2026-08-14
    note: >-
      The "no answer projected" case. Only answer is required by the schema;
      emitting citations as an empty array rather than omitting it is
      Servicesim's choice, so a consumer's array handling is always exercised.

  - golden: exa-answer-structured.json
    endpoint: POST /answer
    status: 200
    kind: vendor-documented
    documentation_url: https://exa.ai/docs/reference/answer
    verified: 2026-08-14
    note: >-
      outputSchema supplied. The answer key is a oneOf on itself and becomes an
      object; unlike /search there is no output object and no grounding array,
      so field-level provenance does not exist on this route.

  - golden: exa-answer-400-invalid-json-schema.json
    endpoint: POST /answer
    status: 400
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/answer
    verified: 2026-08-14
    note: >-
      INVALID_JSON_SCHEMA is a documented tag for a malformed outputSchema; the
      message text is reconstructed.

  - golden: exa-answer-501.json
    endpoint: POST /answer
    status: 501
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/answer
    verified: 2026-08-14
    note: >-
      UNABLE_TO_GENERATE_RESPONSE is documented as /answer-only and must not be
      reachable on /search. The message text is reconstructed.

  - golden: exa-agent-runs-created.json
    endpoint: POST /agent/runs
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      Read from the OpenAPI spec (createAgentRun, AgentRun), which documents
      only a 200 for the create (spec line 831). The ten keys, their order, the
      object constant, the null stopReason, completedAt and request and the
      required output, usage and costDollars objects are vendor-documented
      shape (AgentRun, line 5793). Every VALUE is Servicesim's: the spec has no
      example bodies, so the id suffix, createdAt and the zero placeholders for
      the required output, usage and costDollars keys are SIMULATOR-POLICY, not
      a claim about what the live service sends or bills. request is null, which
      the schema permits, because the job record holds no request body. The full
      record is docs/audits/2026-10-01-exa-agent.md.

  - golden: exa-agent-runs-running.json
    endpoint: GET /agent/runs/{id}
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      A non-terminal poll snapshot. The same ten keys as the create, because
      AgentRun requires them on every status: stopReason and completedAt are
      nullable (spec lines 5803 and 5812; the spec states nullability, not
      when the value is null, so null until terminal is SIMULATOR-POLICY) and
      output, usage and costDollars are non-nullable required objects
      (5822-5827), so they are present as zero-valued placeholders. That the live API sends
      zero-valued objects on a run that has not finished is INFERENCE from the
      nullability marking, not a read example — the earlier reading that
      output exists only at a terminal status came from a prose page and the
      spec does not support it. Every value is simulator-chosen.

  - golden: exa-agent-runs-completed.json
    endpoint: GET /agent/runs/{id}
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      A terminal run. status: completed and stopReason: schema_satisfied are
      documented enum members; which reason a status derives is not documented
      (the spec pairs none), so schema_satisfied here is SIMULATOR-POLICY.
      completedAt equals createdAt because Servicesim has no elapsed-time model
      (SIMULATOR-POLICY). output is AgentRunOutput (spec line 5921) with all
      three keys; the grounding entry is AgentGrounding and its citation is
      AgentCitation, {url, title} and nothing else (lines 5942-5977) — an
      earlier fixture also carried a citation id the schema does not allow.
      structured is an explicit null, which the schema permits when no
      outputSchema was supplied. costDollars is AgentCostDollars (line 6009):
      total is the scenario's scripted 0.045, which is the only scripted cost
      fact; search is a plain number here, not the {neural} object of
      CostDollarsOutput, and the other components are zero placeholders that do
      not sum to total and make no billing claim. usage is the four required
      counters at zero for the same reason. The "recorded inference" that total
      is emitted is now verified by the schema (line 6012).

  - golden: exa-agent-runs-failed.json
    endpoint: GET /agent/runs/{id}
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      A terminal failure: status: failed with stopReason: error, both documented
      enum members (pairing them is SIMULATOR-POLICY). There is deliberately NO
      error key: AgentRun has no run-level error and is additionalProperties:
      false (spec line 5839), so the {code, message} object an earlier version of
      this fixture carried was Servicesim's own construction and has been
      removed; a scenario that still declares one is a load error. output,
      usage and costDollars are the zero-valued placeholders for their required
      keys, and completedAt is the scenario's base time.

  - golden: exa-agent-runs-404.json
    endpoint: GET /agent/runs/{id}, an identifier this process never minted
    status: 404
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      Fail-closed. getAgentRun documents a 404 "Run not found" (spec line 1019)
      and every agent error body is AgentErrorResponse, {error: {type, code,
      message}} (line 6044), not the flat envelope the other routes use. The
      spec closes the type and code enums but does not pair them with a status:
      NOT_FOUND / RUN_NOT_FOUND is INFERENCE from the enum names, and the
      message reuses the response description. The x-request-id header the spec
      documents on this response is not part of the body and is asserted in the
      tests.

  - golden: exa-agent-runs-503.json
    endpoint: POST /agent/runs, refused at the configured job bound
    status: 503
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-01
    note: >-
      Not a vendor status: createAgentRun documents no 503 (its error statuses
      are 400, 401, 429 and 500), so this is Servicesim refusing to hold more
      job state. It uses AgentErrorResponse's shape with SERVER_ERROR for both
      type and code, which is SIMULATOR-POLICY for a status the spec does not
      cover. The message names the bound and the remedy (POST /__admin/reset, a
      fresh namespace, or raising the bound), which is the part a consumer's
      test failure output actually needs to be actionable — the wire text
      itself does not name the --max-jobs flag.

  - golden: exa-agent-runs-cancelled.json
    endpoint: POST /agent/runs/{id}/cancel, a cancel recorded on a running run
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun (spec line 1153) answers 200 with an AgentRun, and has no
      request body. The shape is the poll's (AgentRun, line 5793), because the
      response IS the snapshot the run's next poll returns: here the scenario's
      cancel script is one cancelled snapshot. status: cancelled and stopReason:
      cancelled are documented enum members (pairing them is SIMULATOR-POLICY).
      The spec says usage accrued before cancellation is billed, so usage and
      costDollars are the scenario's scripted values (agentComputeUnits 2.5,
      searches 3; total 0.031, agentCompute 0.025, search 0.006), and the
      components left at zero are placeholders, not billing facts. Whether the
      live cancel answers the cancelled run at once or an intermediate status
      first is not documented; the scenario scripts which.

  - golden: exa-agent-runs-cancel-401.json
    endpoint: POST /agent/runs/{id}/cancel, no credential presented
    status: 401
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun documents a 401 "Team context or authentication was not
      found" in AgentErrorResponse's shape. AUTHENTICATION_ERROR /
      TEAM_NOT_FOUND is INFERENCE from the enum names (the spec pairs no type
      and code with a status), and the message is the response description.
      Nothing is claimed or recorded on the run.

  - golden: exa-agent-runs-cancel-404.json
    endpoint: POST /agent/runs/{id}/cancel, a run this namespace does not hold
    status: 404
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun documents a 404 "Run not found". The body is the same
      RUN_NOT_FOUND envelope a poll of an unknown id gets (NOT_FOUND /
      RUN_NOT_FOUND is INFERENCE from the enum names), for an id never minted,
      one minted in another namespace, or a malformed one. Nothing is claimed.

  - golden: exa-agent-runs-cancel-500.json
    endpoint: POST /agent/runs/{id}/cancel, a cancel the scenario cannot answer
    status: 500
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun documents a 500 "Server error or run timeout". This is the
      body Servicesim answers when the cancel would take effect but the
      scenario scripts no cancel.turns to answer the polls after it
      (job.cancel_unscripted), or when the run's position kept moving
      (job.cancel_contended): SERVER_ERROR for both type and code, and the
      same fixed message as the simulator's other internal 500s. That
      condition is SIMULATOR-POLICY, not a vendor behaviour; nothing is
      recorded on the run. A scripted {status: 500} fault answers the
      fault's own body instead ("Server error"), which this golden does not
      cover.

  # The 400 and the 429 below were added by issue #37, to give cancelAgentRun's two
  # remaining documented statuses a golden each. A golden is dated by the audit that
  # actually read its operation, and cancelAgentRun was read on 2026-10-02
  # (docs/audits/2026-10-01-exa-agent.md, "Cancel, 2026-10-02"), so both carry
  # that date. The operation and AgentErrorResponse were read once more on
  # 2026-10-04 against a fresh fetch of exa-spec.yaml whose sha256 is identical to
  # the spec: block's, so nothing moved. Neither entry is dated 2026-10-04: an
  # entry newer than the provider-level verified: fails contracts.Conform, so it
  # would drag that date and spec.retrieved forward for a confirmation recorded
  # only here, and the re-read of the other Exa routes is still owed (issue #11).
  - golden: exa-agent-runs-cancel-400.json
    endpoint: POST /agent/runs/{id}/cancel, a scripted cancel.fault of status 400
    status: 400
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun documents a 400 "Invalid request." (spec line 1178,
      #/paths/~1agent~1runs~1{id}~1cancel/post/responses/400) in
      AgentErrorResponse's shape (line 6044): one required key, error, and no
      other. From the specification: that envelope, AgentError's three required
      string keys (type, code, message; line 6052) and the closed enums the two
      values below belong to (#/components/schemas/AgentError/properties/type/enum
      and /properties/code/enum). The spec pairs no type and code with a status:
      INVALID_REQUEST / INVALID_REQUEST is INFERENCE from the enum names and the
      description. The message is Servicesim's: AgentError.message is a bare
      string with no description or example, so "Invalid request" is the response
      description with its full stop dropped (SIMULATOR-POLICY). It is the body a
      scripted cancel.fault attempt of status 400 renders when it scripts no
      error:, tag: or body: of its own (they would replace the message, the
      code, or the whole body). The route's own 400, for a body that is not a
      JSON object, is a different body (the finding's text: "request body must
      be a JSON object", or "request body is not valid JSON" for malformed JSON;
      measured on the handler; SIMULATOR-POLICY) and has no golden. A faulted
      attempt that is not accepted: true records nothing on the run. The
      x-request-id header the spec documents on this response is not part of the
      body and is asserted in the tests.

  - golden: exa-agent-runs-cancel-429.json
    endpoint: POST /agent/runs/{id}/cancel, a scripted cancel.fault of status 429
    status: 429
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/exa-spec.yaml
    api_version: "2.0.0"
    verified: 2026-10-02
    note: >-
      cancelAgentRun documents a 429 "Agent run concurrency limit reached."
      (spec line 1205,
      #/paths/~1agent~1runs~1{id}~1cancel/post/responses/429) in
      AgentErrorResponse's shape (line 6044). From the specification: that
      envelope, AgentError's three required string keys and the closed enums the
      two values below belong to (#/components/schemas/AgentError/properties/type/enum
      and /properties/code/enum). The spec pairs no type and code with a status:
      RATE_LIMIT_ERROR / CONCURRENCY_LIMIT_REACHED is INFERENCE from the enum
      names and the description. The message is Servicesim's: AgentError.message
      is a bare string with no description or example, so the text is the
      response description with its full stop dropped (SIMULATOR-POLICY). The
      profile models no concurrency limit and serves a cancel 429 only from a
      scripted cancel.fault attempt; an attempt's own error: would replace the
      message, its tag: the code and its body: the whole body, none of which
      this golden covers. A faulted attempt that is not accepted: true records
      nothing on the run.
      The x-request-id header the spec documents on this response is not part of
      the body and is asserted in the tests.

  - golden: exa-contents-happy.json
    endpoint: POST /contents
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/get-contents
    verified: 2026-08-15
    note: >-
      D-a's resolution mechanism, not a vendor-quoted example: two requested
      URLs resolved against the turn's own results (the same list /search
      renders from), each yielding a "success" status entry with no `source`
      key — both vendor success examples on this page omit it even on
      status: success, which is why the default rendering omits it too. The
      result object fields (title, url, id, publishedDate, author, text,
      image, favicon) are the same SearchResultOutput family /search's own
      happy golden documents; nothing here is /contents-specific except the
      statuses[] array and the absence of highlights/highlightScores/summary,
      which this fixture's projection never declared. results[].text is
      rendered regardless of the request's own text option — simulator-chosen
      per D-c, unlike /answer's citations[].text, which IS gated on the
      request's text flag. costDollars.total is read directly from the
      scenario projection's contents.cost_dollars key — this response field IS
      verified present on /contents (unlike the Agent API's inference), but
      the numeric value 0.003 is Servicesim's own, not the page's example
      (0.003 shown there is illustrative, not a documented constant).

  - golden: exa-contents-empty.json
    endpoint: POST /contents
    status: 400
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-15
    note: >-
      D-g's NO_CONTENT_FOUND branch: every requested identifier failed to
      resolve. The tag and its message are quoted from the error-codes page's
      NO_CONTENT_FOUND row ("No contents could be found for the given URLs"),
      but that page names the tag without an example body, so the envelope
      shape ({requestId, error, tag}, the same flat family every other Exa
      error uses) and the decision to return 400 here rather than a 200 with
      an empty results[] are both simulator-chosen — see handleContents'
      godoc and the NO_CONTENT_FOUND branch comment in provider/exa/contents.go
      for why this direction was picked: the branch fires against the
      request's DEFAULT resolution, before any contents.statuses override
      runs, so a scripted per-URL failure for the request's only identifier
      is never reinterpreted as "nothing here at all".

  - golden: exa-contents-per-url-failure.json
    endpoint: POST /contents
