      ("the shape AND the values"), and the values here are not all vendor's.

  - golden: exa-agent-runs-completed.json
    endpoint: GET /agent/runs/{id}
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/agent-api/overview
    verified: 2026-08-15
    note: >-
      A terminal run. status: completed, stopReason: schema_satisfied and
      output.text are vendor-documented fields and values. Everything else here
      is Servicesim's: id and createdAt are simulator-chosen (NOT VERIFIED in
      the README, same as every other agent-run entry); output.grounding's
      shape is NOT VERIFIED, and the {title, url, id} citation triple used here
      is the same simulator choice exa-search-structured.json makes, not a
      vendor shape; costDollars.total is the RECORDED INFERENCE in
      contracts/exa/README.md's "Recorded inference" section (not read from a
      vendor example) — see that section before changing this fixture.
      costDollars.dataSources is not emitted here because the scenario did not
      declare one, which is also the documented default. Separately:
      output.structured now renders explicit null on this fixture, matching
      contracts/exa/README.md's response-fields table, which documents
      output.structured as object|null, "null when no schema was supplied".
      A prior pass of this fixture omitted the key instead, because
      provider/exa/agentrun_handler.go's outputWire declared its Structured
      field with the json tag structured,omitempty; that was a real
      disagreement between the code and the README (the authority), and the
      fix — dropping omitempty so a nil interface value renders JSON null —
      is what changed this golden on 2026-08-15 as part of Phase 4. This
      entry stays simulator-chosen because output.structured being an
      explicit null in the absence of a captured example run (as opposed to
      merely present-vs-absent) is Servicesim's reading of the field-table
      wording, not a vendor-observed response.

  - golden: exa-agent-runs-failed.json
    endpoint: GET /agent/runs/{id}
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/agent-api/overview
    verified: 2026-08-15
    note: >-
      A terminal failure: status: failed and stopReason: error are both
      documented enum values. The `error` object is NOT vendor-documented: the
      response-fields table in contracts/exa/README.md's async section has no
      `error` row, and grepping the whole async section finds `error` only as
      one of the four documented stopReason enum values — never as a top-level
      run-object key with its own shape. The {code, message} shape rendered
      here traces to docs/design/async-jobs.md's design and
      provider/exa/agentrun_handler.go's errorWire, i.e. it is Servicesim's
      construction, unverified against any vendor example, and a dated
      re-verification against a real failed run is what would confirm or
      correct it. Note
      costDollars.total is 0, not absent: the terminal-run inference in the
      completed golden's entry applies regardless of outcome, and a failed run
      still reports a (possibly zero) spend rather than omitting the key. id
      and createdAt are simulator-chosen, same as every other agent-run entry.

  - golden: exa-agent-runs-404.json
    endpoint: GET /agent/runs/{id}, an identifier this process never minted
    status: 404
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-15
    note: >-
      Fail-closed: the flat {requestId, error, tag} envelope and the NOT_FOUND
      tag are the same ones exa-search-404.json uses for unmatched routing: the
      Agent API documents no run-specific 404 body of its own, so the general
      error envelope applies here too.

  - golden: exa-agent-runs-503.json
    endpoint: POST /agent/runs, refused at the configured job bound
    status: 503
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/agent-api/overview
    verified: 2026-08-15
    note: >-
      Not a vendor status: this is Servicesim refusing to hold more job state,
      using the same flat error envelope and INTERNAL_ERROR tag as every other
      simulator-side 5xx. The message names the bound and the remedy
      (POST /__admin/reset, a fresh namespace, or raising the bound), which is
      the part a consumer's test failure output actually needs to be
      actionable — the wire text itself does not name the --max-jobs flag.

  - golden: exa-contents-happy.json
    endpoint: POST /contents
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/get-contents
    verified: 2026-08-15
    note: >-
      D-a's resolution mechanism, not a vendor-quoted example: two requested
      URLs resolved against the turn's own results (the same list /search
      renders from), each yielding a "success" status entry with no `source`
      key — both vendor success examples on this page omit it even on
      status: success, which is why the default rendering omits it too. The
      result object fields (title, url, id, publishedDate, author, text,
      image, favicon) are the same SearchResultOutput family /search's own
      happy golden documents; nothing here is /contents-specific except the
      statuses[] array and the absence of highlights/highlightScores/summary,
      which this fixture's projection never declared. results[].text is
      rendered regardless of the request's own text option — simulator-chosen
      per D-c, unlike /answer's citations[].text, which IS gated on the
      request's text flag. costDollars.total is read directly from the
      scenario projection's contents.cost_dollars key — this response field IS
      verified present on /contents (unlike the Agent API's inference), but
      the numeric value 0.003 is Servicesim's own, not the page's example
      (0.003 shown there is illustrative, not a documented constant).

  - golden: exa-contents-empty.json
    endpoint: POST /contents
    status: 400
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-15
    note: >-
      D-g's NO_CONTENT_FOUND branch: every requested identifier failed to
      resolve. The tag and its message are quoted from the error-codes page's
      NO_CONTENT_FOUND row ("No contents could be found for the given URLs"),
      but that page names the tag without an example body, so the envelope
      shape ({requestId, error, tag}, the same flat family every other Exa
      error uses) and the decision to return 400 here rather than a 200 with
      an empty results[] are both simulator-chosen — see handleContents'
      godoc and the NO_CONTENT_FOUND branch comment in provider/exa/contents.go
      for why this direction was picked: the branch fires against the
      request's DEFAULT resolution, before any contents.statuses override
      runs, so a scripted per-URL failure for the request's only identifier
      is never reinterpreted as "nothing here at all".

  - golden: exa-contents-per-url-failure.json
    endpoint: POST /contents
    status: 200
    kind: simulator-chosen
    documentation_url: https://exa.ai/docs/reference/error-codes
    verified: 2026-08-15
    note: >-
      Pins the mechanism the /contents section states explicitly: "a
      CRAWL_NOT_FOUND on one requested URL out of ten does not make the
      overall response non-200". One of two requested URLs resolves and
      renders normally; the other renders no result and a statuses[] entry
      carrying CRAWL_NOT_FOUND (a documented /contents-specific tag) with
      httpStatusCode 404. CRAWL_NOT_FOUND is a vendor-documented tag; using it
      as this simulator's own default for "the corpus has nothing under this
      identifier" is Servicesim's choice, since the page names the tag
      without a captured statuses[] example.

