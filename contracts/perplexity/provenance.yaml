# Provenance for the Perplexity golden wire fixtures.
#
# Every golden in this directory has exactly one entry here, and
# contracts/contracts_test.go fails the build if that stops being true.
#
# Two `verified:` dates live in this file, and they answer different questions:
#   - the top-level one (below) is when THIS PROVIDER'S CONTRACT AS A WHOLE was
#     last verified, and must match contracts/README.md's index-table Verified
#     column for perplexity.
#   - each entry's own `verified:` is when THAT GOLDEN'S SHAPE was last checked
#     against its documentation_url. Refreshing one fixture moves only its own
#     date; it does not imply every other entry was re-checked, and the test
#     suite no longer requires them all to agree.
#
# kind:
#   vendor-documented  the shape AND the values come from the vendor's own
#                      machine-readable specification.
#   simulator-chosen   Servicesim picked this shape or these values. The live
#                      contract canary may correct it from a real response.
#
# Unlike Exa and Tavily, this provider's contract was generated directly from
# https://docs.perplexity.ai/openapi.json rather than from prose pages, so
# "vendor-documented" here means "named in that specification". README.md in
# this directory is the authority and must not be edited by fixture work.
#
# Sonar is supported only until 2026-09-27; the Agent API is its successor and
# both surfaces are simulated.

provider: perplexity
verified: 2026-08-15

goldens:
  - golden: perplexity-sonar-happy.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      Choice carries BOTH message and delta: the specification declares delta
      required alongside message, so a non-streaming response still emits an
      (empty) delta. UsageInfo requires cost, which the plan document omits
      entirely and which a schema-validating consumer would reject the response
      for missing. created is Scenario.Time.Base.Unix(), never time.Now().
      citations is emitted for legacy consumers but is deprecated in favour of
      search_results.

  - golden: perplexity-sonar-empty.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      Zero-result success. search_results and citations are optional and are
      omitted rather than emitted empty; usage.cost stays present because the
      specification requires it even at zero cost.

  - golden: perplexity-sonar-400.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 400
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      The specification declares no body for any non-422 Sonar status. This is
      FastAPI's default {"detail": "<string>"} and is an inference. Note detail
      is a STRING here and an ARRAY for 422 - both are legal FastAPI and a
      consumer must not assume one type. Correcting this from a real response is
      an explicit job for the live contract canary.

  - golden: perplexity-sonar-401.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 401
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: Non-422 Sonar body; unverified, see perplexity-sonar-400.json.

  - golden: perplexity-sonar-422.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 422
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      HTTPValidationError, the one error body the specification schematises.
      loc elements are strings or integers in the same array. Entry order is
      semantic, which is why findings are totally ordered before rendering -
      an unsorted findings list would make these bytes differ run to run.

  - golden: perplexity-sonar-429.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 429
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: Non-422 Sonar body; unverified, see perplexity-sonar-400.json.

  - golden: perplexity-sonar-500.json
    endpoint: POST /v1/sonar (alias POST /chat/completions)
    status: 500
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: Non-422 Sonar body; unverified, see perplexity-sonar-400.json.

  - golden: perplexity-404.json
    endpoint: any unmatched path on the Perplexity listener
    status: 404
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      Fail-closed routing. An unmatched path cannot know which of the two
      surfaces was intended, so routing errors use the Sonar-shaped
      {"detail": "<string>"} body rather than the Agent API's ErrorInfo. Both
      the choice and the message are Servicesim's.

  - golden: perplexity-405.json
    endpoint: a known Perplexity path with an unsupported method
    status: 405
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: Served with an Allow header. Shape and message are Servicesim's.

  - golden: perplexity-agent-happy.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      SearchResult.id is an INTEGER - the one identifier in this repository that
      is not a string, not a source ID and not a URL. output[] order is fixed at
      search_results then message, mirroring the execution order the trace
      represents. Field names are all from the specification; the enum VALUES
      "output_text" (ContentPartType) and "url_citation" (Annotation.type) are
      inferred from the OpenAI-compatible naming, as the generated contract does
      not enumerate those members.

  - golden: perplexity-agent-empty.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      Zero-result success. results and annotations are emitted as empty arrays
      rather than omitted so a consumer's array handling is always exercised.
      Same ContentPartType inference as perplexity-agent-happy.json.

  - golden: perplexity-agent-failed.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      A terminal failure reported inside a 200 body: status is the Status enum
      member "failed" and error is the specification's ErrorInfo. This is how a
      consumer's terminal-state handling is exercised without an HTTP-level
      fault, and a consumer that only branches on the status code misses it.

  - golden: perplexity-agent-400.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 400
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      ErrorInfo is declared on the agent operations, so the {"error": {...}}
      envelope is the specification's, not an inference. Only message is
      required. The code and type VALUES are Servicesim's; the specification
      does not enumerate them.

  - golden: perplexity-agent-401.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 401
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: ErrorInfo envelope; code and type values are Servicesim's.

  - golden: perplexity-agent-403.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 403
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: ErrorInfo envelope; code and type values are Servicesim's.

  - golden: perplexity-agent-422.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 422
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: >-
      HTTPValidationError, not ErrorInfo. The asymmetry is real and deliberate:
      422 follows FastAPI's validation convention on both surfaces while the
      Agent API declares ErrorInfo for every other status. Do not unify them.

  - golden: perplexity-agent-429.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 429
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: ErrorInfo envelope; code and type values are Servicesim's.

  - golden: perplexity-agent-500.json
    endpoint: POST /v1/agent (alias POST /v1/responses)
    status: 500
    kind: vendor-documented
    documentation_url: https://docs.perplexity.ai/openapi.json
    verified: 2026-08-14
    note: ErrorInfo envelope; code and type values are Servicesim's.

  - golden: perplexity-sonar-stream.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_mode full
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Full-mode GrammarDelta transcript for a three-delta turn (Phase 5 unit 1,
      docs/design/streaming.md §7 "Resolved 2026-08-15" A3). Vendor-pinned:
      unnamed data: frames, object: chat.completion.chunk, choices[0].index,
      finish_reason present (null on every non-terminal chunk, the scripted
      value on the terminal one), that every chunk carries both delta and the
      server-side-aggregated message, usage.cost's field names, and — via
      declared OpenAI compatibility only, not a direct Sonar statement — the
      data: [DONE] sentinel. Simulator-chosen, correctable from a captured
      live response per docs/design/streaming.md §10 step 3: that usage rides
      on the SAME chunk as finish_reason and search_results (the vendor
      confirms this placement only for stream_mode: concise, on
      chat.reasoning.done/chat.completion.done); that id stays constant while
      created is pinned constant at time.base rather than moving the way the
      vendor's own concise-mode example shows it (a deliberate departure, not
      an extension, so this golden stays byte-stable); that search_results
      repeats on every chunk rather than only the terminal one (the vendor
      states "multiple times during stream" without saying which); and that
      finish_reason: null specifically for full mode (inferred from the
      concise-mode example, unstated for full mode by any fetched page). No
      citations: none appear in any fetched vendor streaming frame. The two
      response headers this golden's request would receive on the real wire
      — Content-Type: text/event-stream and Cache-Control: no-cache — are
      also simulator-chosen, not vendor-pinned: no fetched page or the
      openapi.json document states either header for this surface (the
      OpenAPI document declares no text/event-stream content type at all for
      /v1/sonar, per this file's own "Streaming (SSE)" section above).

  - golden: perplexity-sonar-stream-disconnect.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_disconnect fault
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Phase 5 unit 2 (docs/design/streaming.md §9). The same three-delta turn
      as perplexity-sonar-stream.sse, scripted with `fault: {attempts:
      [{kind: stream_disconnect, after_chunk: 2, reset: true}]}`. The
      transcript is exactly chunk 0 and chunk 1's frames, byte-identical to
      the first two frames of perplexity-sonar-stream.sse — stream_disconnect
      aborts BEFORE writing the chunk at AfterChunk, so chunk 2 (the third
      delta) and the terminal chunk never reach the wire at all, not even
      partially: the RST lands at a clean frame boundary, which is the
      distinction from the truncate-chunk golden below. Entirely
      simulator-chosen: no vendor page documents a disconnect transcript.

  - golden: perplexity-sonar-stream-truncate.sse
    endpoint: POST /v1/sonar (aliases POST /chat/completions, POST /v1/chat/completions), stream_truncate_chunk fault
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.perplexity.ai/docs/sonar/pro-search/stream-mode.md
    verified: 2026-08-15
    note: >-
      Phase 5 unit 2 (docs/design/streaming.md §9). The same three-delta turn
      as perplexity-sonar-stream.sse, scripted with `fault: {attempts:
      [{kind: stream_truncate_chunk, after_chunk: 1, truncate_after_bytes:
      40}]}`. The transcript is chunk 0's frame in full, byte-identical to
      perplexity-sonar-stream.sse's first frame, followed by exactly the
      first 40 bytes of chunk 1's frame — a malformed, mid-object "data:"
      line with no terminating blank line — then the connection dies.
      Deliberately NOT a clean frame boundary, unlike the disconnect golden
      above: that distinction is the entire reason this fault kind exists
      rather than reusing stream_disconnect. Entirely simulator-chosen: no
      vendor page documents a truncated-frame transcript.
