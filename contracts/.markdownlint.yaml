# Configuration for contracts/ only.
#
# markdownlint-cli2 resolves the NEAREST config rather than merging with
# ancestors, so this must extend the repository defaults explicitly or it
# silently drops every rule tuned there.
extends: ../.markdownlint.yaml

# These files are GENERATED from vendor documentation — the Perplexity one
# directly from the vendor's OpenAPI document. Their content is wide reference
# tables and verbatim evidence quotes, where reflowing to 120 columns would
# either corrupt a table row or silently edit a quotation. Line length is the
# wrong constraint for generated reference data.
MD013: false
