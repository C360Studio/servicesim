# Provenance for the Tavily golden wire fixtures.
#
# Every golden in this directory has exactly one entry here, and
# contracts/contracts_test.go fails the build if that stops being true.
#
# Two `verified:` dates live in this file, and they answer different questions:
#   - the top-level one (below) is when THIS PROVIDER'S CONTRACT AS A WHOLE was
#     last verified, and must match contracts/README.md's index-table Verified
#     column for tavily.
#   - each entry's own `verified:` is when THAT GOLDEN'S SHAPE was last checked
#     against its documentation_url. Refreshing one fixture moves only its own
#     date; it does not imply every other entry was re-checked, and the test
#     suite no longer requires them all to agree.
#
# kind:
#   vendor-documented  the shape AND the values come from the vendor's own
#                      documentation, quoted or directly derived from it.
#   simulator-chosen   Servicesim picked this shape or these values. A dated
#                      re-verification (contracts/README.md "Keeping them
#                      honest") may correct it from a real response — there is
#                      no live contract canary.
#
# The field names in every golden are governed by README.md in this directory,
# which is the authority and must not be edited by fixture work.
#
# spec: records the machine-readable specification Tavily publishes,
# https://docs.tavily.com/documentation/api-reference/openapi.json, covering
# every route this provider simulates (/search, /extract, /research,
# /research/{request_id}) — fetched and hashed 2026-08-16. Its sha256 is the
# DRIFT SIGNAL for this provider: an unchanged hash on a fresh fetch means
# nothing below needs re-reading; a changed one means re-read the consumed
# fields against both the per-entry documentation_url pages below and the
# spec itself (contracts/README.md "Keeping them honest"), then update
# whatever changed.
#
# A changed spec.sha256 is not itself a diff of what this file consumes:
# every entry's documentation_url below is a rendered prose page, not the
# spec, and the spec's own bytes can move for reasons this provider's
# contract never touches (/crawl, /map, /logs, /org-usage, /usage — none of
# them simulated). The hash says "go re-read the pages", not "here is what
# changed" — the per-entry documentation_url and verified date remain the
# record of what was actually verified and against what. No entry below was
# read from the spec directly, so none carries api_version.

provider: tavily
verified: 2026-08-15

spec:
  url: https://docs.tavily.com/documentation/api-reference/openapi.json
  version: "1.0.0"
  sha256: f13ba20f158a40ca5776fff3d665ded0010c8f71bce15795defa72b863ef26f8
  retrieved: 2026-08-16

goldens:
  - golden: tavily-search-happy.json
    endpoint: POST /search
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      response_time is a JSON NUMBER. The schema declares type number, format
      float; the quoted YAML example scalar '1.67' is what makes implementers
      encode it as a string, and a string breaks every typed consumer. answer,
      images, results and response_time are all required, so all four keys are
      present even when unrequested.

  - golden: tavily-search-empty.json
    endpoint: POST /search
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      Zero-result success. answer is an explicit null rather than an absent key:
      the schema requires it while its description says it appears only when
      include_answer was requested, and a present null breaks fewer consumers
      than a sometimes-missing required key.

  - golden: tavily-search-news.json
    endpoint: POST /search
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/best-practices/best-practices-search.md
    verified: 2026-08-14
    note: >-
      topic=news with every optional field populated: published_date (documented
      in prose for topic=news only, not in the response schema), favicon,
      per-result images, raw_content as a string, auto_parameters and the
      include_usage credits object. images items are OBJECTS with url and
      description, never bare URL strings.

  - golden: tavily-400.json
    endpoint: POST /search
    status: 400
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      The {detail: {error}} envelope is documented and exact. The message is
      Servicesim's: the documented example text still says "Must be 'general' or
      'news'", which is stale against the current three-value topic enum, so it
      is not reproduced verbatim.

  - golden: tavily-401.json
    endpoint: POST /search
    status: 401
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: Reproduced verbatim from the documented 401 example.

  - golden: tavily-429.json
    endpoint: POST /search
    status: 429
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      Reproduced verbatim. No Retry-After header is documented, so none is
      emitted. Reused byte-for-byte by POST /extract's rate-limit fault test
      (provider/tavily's TestGolden_ExtractRateLimited): faultBody's
      status-to-message mapping is shared across every route on this
      provider, so the envelope does not vary by route — only the attempt
      budget it is drawn from does (tavily:extract, a separate counter from
      tavily:search).

  - golden: tavily-432.json
    endpoint: POST /search
    status: 432
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      Non-standard 432, documented as "Key limit or Plan Limit exceeded". Text
      taken from the documented example with its angle-bracket placeholder
      removed.

  - golden: tavily-433.json
    endpoint: POST /search
    status: 433
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      A second non-standard status, "PayGo limit exceeded". Reproduced verbatim.

  - golden: tavily-500.json
    endpoint: POST /search
    status: 500
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: Reproduced verbatim from the documented 500 example.

  - golden: tavily-404.json
    endpoint: any unmatched path on the Tavily listener
    status: 404
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: >-
      Fail-closed routing. The envelope is the documented one and is the only
      one of the three providers' routing envelopes that is vendor-verified; the
      message text is Servicesim's.

  - golden: tavily-405.json
    endpoint: a known Tavily path with an unsupported method
    status: 405
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-14
    note: Served with an Allow header. The message text is Servicesim's.

  - golden: tavily-research-created.json
    endpoint: POST /research
    status: 201
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/research
    verified: 2026-08-15
    note: >-
      All six documented fields (request_id, created_at, status, input, model,
      response_time) are required and all six are present, which is the
      vendor-documented part of this fixture. Several of the VALUES are
      Servicesim's, not the vendor's: the request_id FORMAT is not
      vendor-documented (see contracts/tavily/README.md "Divergences"), and the
      UUID shape here matches /search's convention rather than a documented
      one; model defaults to "auto" when the request omits it, which the
      README's request table lists as a valid enum member but never as a
      documented default; response_time is 0 because no work happened yet, an
      arbitrary but plausible value rather than a read one; created_at is
      rendered as millisecond-precision ISO-8601 with a Z suffix, and the
      README records created_at's type as `string` with no format specified.
      A re-verification correcting any of these should treat them as open,
      not settled.

  - golden: tavily-research-pending.json
    endpoint: GET /research/{request_id}
    status: 202
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/research-get
    verified: 2026-08-15
    note: >-
      A non-terminal poll: exactly request_id, status and response_time, and the
      202 status code itself is part of the contract, not a constant 200 with a
      status field. created_at, content and sources are all absent.

  - golden: tavily-research-completed.json
    endpoint: GET /research/{request_id}
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/research-get
    verified: 2026-08-15
    note: >-
      A terminal success: created_at, content and sources join the always-present
      three, and the status code moves from 202 to 200. sources[] is the
      documented {title, url, favicon} triple.

  - golden: tavily-research-failed.json
    endpoint: GET /research/{request_id}
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/research-get
    verified: 2026-08-15
    note: >-
      A terminal failure carries ONLY request_id, status and response_time —
      no created_at, no content, no sources. Corrected 2026-08-15: the
      poll-status-code table in contracts/tavily/README.md previously read
      "completed, failed" both carry created_at/content/sources, which
      disagreed with the GET response field table below it (all three marked
      "completed only") and with the page's own prose, "Failed Tasks Only: no
      additional fields beyond the three common fields". The README row is now
      corrected to match; this is a wire change from what Servicesim emitted
      before today (a spurious created_at on every failed poll), released an
      hour after v0.2.0 shipped the route — see the next tag's release note.
      No failure/error body shape beyond the three common fields is documented
      for this surface; there is nothing else to render.

  - golden: tavily-research-404.json
    endpoint: GET /research/{request_id}, an identifier this process never minted
    status: 404
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    verified: 2026-08-15
    note: >-
      Fail-closed, byte-identical to tavily-404.json: the research surface
      documents no task-specific 404 body of its own, so the same
      {"detail":{"error":"Not Found"}} envelope used for unmatched routing
      applies here too.

  - golden: tavily-research-503.json
    endpoint: POST /research, refused at the configured job bound
    status: 503
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/research
    verified: 2026-08-15
    note: >-
      Not a vendor status: this is Servicesim refusing to hold more job state,
      using the same {"detail":{"error": …}} envelope as every other documented
      status. The message names the bound and the remedy (POST /__admin/reset, a
      fresh namespace, or raising the bound) — the wire text itself does not
      name the --max-jobs flag.

  - golden: tavily-extract-happy.json
    endpoint: POST /extract
    status: 200
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    verified: 2026-08-15
    note: >-
      Two requested URLs, resolved by D-a's two-step lookup: report-a is named
      by this turn's own /search-shaped `results:` entry, whose raw_content and
      images overrides win; report-b is corpus-only and resolves purely by
      exact scenario.Source.URL match, picking up its corpus text and single
      Image field. Field names, required-ness and the field ORDER (url,
      raw_content, images, favicon; results, failed_results, response_time,
      usage, request_id) are vendor-documented per this file's "POST /extract"
      section, all of it inferred rather than a declared `required` list — the
      page's schema carries none. results[].images is an array of BARE URL
      STRINGS, not the {url, description} objects /search uses for the same
      field name on the same provider — the single most likely implementation
      mistake on this route. usage.credits is simulator-chosen (1, the
      documented basic-depth cost) because the scenario declares no usage
      block of its own; request_id and response_time are both scenario
      overrides, not derived, so this golden carries no digest to audit.

  - golden: tavily-extract-empty.json
    endpoint: POST /extract
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    verified: 2026-08-15
    note: >-
      Every requested URL is unresolvable: results is an empty array (never
      null, never omitted — same convention /search's images/results carry),
      and failed_results carries one entry per requested URL in request
      order. The envelope shape (results, failed_results always present) is
      vendor-documented as inferred; the error TEXT,
      "No content found at the requested URL.", is Servicesim's own choice —
      failed_results[].error is documented only as free text with no enum or
      set of causes (this file's "What is NOT verified" §3).

  - golden: tavily-extract-partial-failure.json
    endpoint: POST /extract
    status: 200
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    verified: 2026-08-15
    note: >-
      One resolvable URL and one URL a projection's `extract.failed_results`
      override forces to fail with its own error text, overriding whatever
      D-a's ordinary lookup would otherwise have produced for it. This is the
      per-URL-failure golden the unit's deliverables list calls for. The
      envelope shape is vendor-documented (as above); the specific error text
      is scenario-authored, which is exactly the point of the override
      mechanism — a scenario author picks a plausible failure reason from
      nothing, because the vendor documents none.

  - golden: tavily-extract-400.json
    endpoint: POST /extract
    status: 400
    kind: simulator-chosen
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    verified: 2026-08-15
    note: >-
      A missing `urls` — the one required field. The {detail: {error}}
      envelope is vendor-documented and exact; the message text is
      Servicesim's own, matching this package's convention for every other
      "Missing X" 400 on this provider (see tavily-400.json's entry).

  - golden: tavily-extract-401.json
    endpoint: POST /extract
    status: 401
    kind: vendor-documented
    documentation_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    verified: 2026-08-15
    note: >-
      Byte-identical to tavily-401.json: /extract's own page reprints the same
      401 example text as /search's. Recorded as its own entry, the same
      pattern tavily-research-404.json already uses for a body that happens to
      match a sibling route's, because provenance is per (route, status), not
      per unique byte string. What differs on this route is not the body but
      which credential placements reach it at all: /extract accepts Bearer
      only (see this file's "POST /extract" § "Auth"), unlike /search's
      additional body-placed api_key.
