# A run/task on each async surface that never reaches a terminal status on its own:
# Exa's agent run, Tavily's research task, and the Perplexity Agent's
# `background: true` run.
#
# One unconditional non-terminal turn per async entry: every poll, however
# many, answers "still running" / "still pending" / "in_progress" (a Perplexity
# background run answers `queued` on its first retrieve, then `in_progress` on
# every one after it) — unless the consumer cancels the Exa run: the cancel's
# response and the first poll after it still answer
# `running`, and the second poll after it answers `cancelled`; or cancels the
# Perplexity background run: the cancel answers `cancelling`, the first retrieve
# after it answers `in_progress`, and the second answers `cancelled`. Servicesim
# never decides a job is stuck — there is no timeout logic here — so what this scenario tests
# is entirely on the consumer's side: does its own poll loop eventually give
# up, rather than retrying forever against a real API that can legitimately
# leave a job outstanding for a long time.
#
# The four synchronous surfaces stay in the ordinary happy shape; this file is
# about the async lifecycle only.
version: 1
name: async-stuck
description: >-
  A well-formed 200 from every synchronous surface, and a run/task on each
  async surface that never terminates on its own (an Exa run or a Perplexity
  background run reports `cancelled` once the consumer cancels it), so a
  consumer's own poll timeout is what is under test. A Perplexity
  `background: true` run is one of them: its first retrieve answers queued and
  every retrieve after it in_progress.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  # This file is about the async lifecycle; /contents, /findSimilar and
  # /extract are left to their D-a/D-b defaults, unexercised.
  exa:
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a

  tavily:
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98

  perplexity:
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. Sixteen built-ins share one block that completes;
    # this is one of the four that script their own, because a run that completed here
    # would break this file's promise on the route a background poll uses. A job's
    # first retrieve is queued, and every retrieve after it is in progress, for good:
    # the last turn is unconditional and non-terminal, so no retrieve is ever served a
    # terminal snapshot, and none bills (an unfinished run scripts no usage). Only a
    # cancel ends it, with the shared cancel block below (in progress, then cancelled
    # with the usage the run accrued), so a consumer that does not cancel has only its
    # own poll timeout. The create still answers the fixed queued stub; this block
    # scripts only the retrieves, and the cancel after them. It carries no fault on
    # purpose: this entry's own `fault:` or `turns:` shape the CREATE, and the
    # retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - respond:
            status: in_progress
      # A cancel is answered `cancelling`, and the retrieves after it read in progress,
      # since an acknowledgement is not proof the run stopped, and then cancelled,
      # billing the usage the run accrued before it stopped: its 24 input tokens and
      # 12 output tokens, at the per-token rates of the corpus's completed run.
      # Nineteen built-ins share this cancel block (extra-fields scripts its own). A
      # cancel made once the run has ended, when its next retrieve would be terminal,
      # is the vendor's 400 and records nothing. It carries no fault on purpose: the
      # cancel's budget is its own. The total_cost is scripted rather than left to the
      # renderer, whose float sum of the two costs would print 0.00015000000000000001.
      cancel:
        turns:
          - when: {call_index: 0}
            respond:
              status: in_progress
          - respond:
              status: cancelled
              usage:
                input_tokens: 24
                output_tokens: 12
                cost:
                  input_cost: 0.0001
                  output_cost: 0.00005
                  total_cost: 0.00015

  # Single-shot, unconditional, and non-terminal: every poll answers running until
  # a cancel; the second poll after one answers cancelled.
  exa_agent_runs:
    status: running
    # A cancel is acknowledged as still running, since an acknowledgement is not
    # proof billing stopped, and the polls after it confirm `cancelled`, billing the
    # usage the run accrued before it.
    cancel:
      turns:
        - when: {call_index: 0}
          respond:
            status: running
        - respond:
            status: cancelled
            usage:
              agent_compute_units: 3
              searches: 2
            cost_dollars:
              total: 0.012

  # Single-shot, unconditional, and non-terminal: every poll answers pending.
  tavily_research:
    status: pending

  # This file's stuck-poll story is about the two async surfaces; mcp stays
  # in the ordinary happy shape, exactly as the other four synchronous
  # surfaces above do.
  mcp:
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
