# A rising-latency ladder, a short outage, then recovery — six attempts per
# route, then plain success forever after.
#
# What a consumer proves: calls 1-4 exercise a latency budget or circuit
# breaker against successively worse response times (50ms, 100ms, 200ms,
# 400ms — each still a plain 200); calls 5-6 exercise a retry policy against
# two consecutive 503s carrying `Retry-After: 1`; call 7 onward proves the
# retry is counted rather than restarting the plan, the same "counted, not
# reset" property `rate-limited` pins for a single 429.
#
# Timing mode matters here more than for any other built-in. The
# ladder is REAL time under the default `DelayReal`: four calls in sequence
# cost roughly 50 + 100 + 200 + 400 = 750ms of genuine wall clock, which is
# why the built-in's own live test keeps that number in mind rather than
# treating it as free. Under `testkit.WithSkippedDelays()` (`DelaySkip`) nothing
# is actually slept — the ladder is free — but `outcome.delay_ms` still
# records the requested values (50, 100, 200, 400) on each entry, so a test
# that only asserts "the scenario asked for this ladder" without paying for it
# can use `DelaySkip`; a test that asserts a client's own latency budget fired
# needs the real delay and must not skip it, for the same reason `timeout`
# must not.
#
# Coverage: one plan per route, exactly as `rate-limited` and `oversized-body`
# declare theirs — Exa `/search`, `/answer`, `/contents`, `/findSimilar`,
# Tavily `/search`, `/extract`, Perplexity Sonar and Agent. The two async
# surfaces carry plain happy-shaped turns and no fault attempt, on the same
# terms `timeout`'s header comment explains: a poll snapshot's timing is the
# client's own retry loop's concern, and `create.fault` is where a
# create-route variant would go, if anyone needs one. A Perplexity
# `background: true` create is the Agent route, so it draws the same ladder
# (each delayed create still mints its job); the retrieve, `GET /v1/agent/{id}`,
# and the cancel, `POST /v1/agent/{id}/cancel`, each have a budget of their own
# and no fault.
version: 1
name: brownout
description: >-
  Every synchronous route serves a rising-latency ladder (50ms, 100ms, 200ms,
  400ms), then two 503s carrying Retry-After, then recovers — a latency
  budget, a circuit breaker and a retry policy, all exercised from one
  scenario (a Perplexity `background: true` create takes the Agent create's
  ladder, each delayed create keeping its job; the retrieve and the cancel,
  each on its own budget, are not faulted).

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  exa:
    fault:
      attempts:
        - delay: 50ms
        - delay: 100ms
        - delay: 200ms
        - delay: 400ms
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
      after: success
    results:
      - source: source-a
    # /answer, /contents and /findSimilar are separate routes with their own
    # attempt budgets, so each needs its own plan; a single block-level fault
    # would leave them healthy. /contents needs no results of its own — it
    # resolves requested URLs against the corpus — but it does need the plan.
    answer:
      fault:
        attempts:
          - delay: 50ms
          - delay: 100ms
          - delay: 200ms
          - delay: 400ms
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
        after: success
      answer: Report A states the finding.
      citations:
        - source-a
    contents:
      fault:
        attempts:
          - delay: 50ms
          - delay: 100ms
          - delay: 200ms
          - delay: 400ms
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
        after: success
    find_similar:
      fault:
        attempts:
          - delay: 50ms
          - delay: 100ms
          - delay: 200ms
          - delay: 400ms
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
        after: success
      results:
        - source: source-a

  tavily:
    fault:
      attempts:
        - delay: 50ms
        - delay: 100ms
        - delay: 200ms
        - delay: 400ms
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
      after: success
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98
    # /extract is its own route with its own budget, independent of /search's.
    extract:
      fault:
        attempts:
          - delay: 50ms
          - delay: 100ms
          - delay: 200ms
          - delay: 400ms
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
          - status: 503
            retry_after: 1
            error: Service temporarily unavailable.
        after: success

  perplexity:
    fault:
      attempts:
        - delay: 50ms
        - delay: 100ms
        - delay: 200ms
        - delay: 400ms
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
      after: success
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    fault:
      attempts:
        - delay: 50ms
        - delay: 100ms
        - delay: 200ms
        - delay: 400ms
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
      after: success
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. A job's retrieves are queued, then in progress,
    # then completed for good, with the usage and cost the run billed. The block is
    # shared by sixteen built-ins (four script their own) and carries no fault on purpose: this entry's own
    # `fault:` or `turns:` shape the CREATE, and the retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - when: {call_index: 1}
          respond:
            status: in_progress
        - respond:
            status: completed
            answer: The background run has completed.
            usage:
              input_tokens: 24
              output_tokens: 96
              cost:
                input_cost: 0.0001
                output_cost: 0.0004
      # A cancel is answered `cancelling`, and the retrieves after it read in progress,
      # since an acknowledgement is not proof the run stopped, and then cancelled,
      # billing the usage the run accrued before it stopped: its 24 input tokens and
      # 12 output tokens, at the per-token rates of the corpus's completed run.
      # Nineteen built-ins share this cancel block (extra-fields scripts its own). A
      # cancel made once the run has ended, when its next retrieve would be terminal,
      # is the vendor's 400 and records nothing. It carries no fault on purpose: the
      # cancel's budget is its own. The total_cost is scripted rather than left to the
      # renderer, whose float sum of the two costs would print 0.00015000000000000001.
      cancel:
        turns:
          - when: {call_index: 0}
            respond:
              status: in_progress
          - respond:
              status: cancelled
              usage:
                input_tokens: 24
                output_tokens: 12
                cost:
                  input_cost: 0.0001
                  output_cost: 0.00005
                  total_cost: 0.00015

  # Async surfaces: plain happy-shaped turns, no fault attempt — see the
  # header comment for why.
  exa_agent_runs:
    turns:
      - when: {call_index: 0}
        respond:
          status: running
      - when: {call_index: 1}
        respond:
          status: running
      - respond:
          status: completed
          output:
            text: Report A states the finding.
          cost_dollars:
            total: 0.045
    # A cancel is acknowledged as still running, since an acknowledgement is not
    # proof billing stopped, and the polls after it confirm `cancelled`, billing the
    # usage the run accrued before it.
    cancel:
      turns:
        - when: {call_index: 0}
          respond:
            status: running
        - respond:
            status: cancelled
            usage:
              agent_compute_units: 3
              searches: 2
            cost_dollars:
              total: 0.012

  tavily_research:
    turns:
      - when: {call_index: 0}
        respond: {status: pending}
      - when: {call_index: 1}
        respond: {status: in_progress}
      - respond:
          status: completed
          content: Report A states the finding.
          sources:
            - source-a

  # One route, one budget — unlike Exa and Tavily above, POST /mcp needs only
  # one fault plan, not one per sub-route.
  mcp:
    fault:
      attempts:
        - delay: 50ms
        - delay: 100ms
        - delay: 200ms
        - delay: 400ms
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
        - status: 503
          retry_after: 1
          error: Service temporarily unavailable.
      after: success
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
