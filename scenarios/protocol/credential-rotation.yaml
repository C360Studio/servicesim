# Every provider requires a single, fixed key: `rotated-key-EXAMPLE`. A
# client presenting anything else gets the vendor's own 401 envelope; a
# client presenting the rotated key gets the ordinary 200 below.
#
# What a consumer proves: its client's rotation source (in a test, its own
# fake secret store, or a value threaded through the test the same way any
# other test credential is) yields the value below, and its client actually
# switches to it — not merely that a fixed key was configured once and never
# checked again. `testkit.AssertDifferentCredential` on the rejected call's
# journal entry and the accepted one's is the assertion that proves rotation
# happened, from the two fingerprints alone; `testkit.AssertSameCredential`
# on the same pair fails, which is the negative half of the same proof.
#
# The expected key is a fixed, DOCUMENTED placeholder rather than something
# generated per run, because `auth` is an entry-level policy (scenario/
# model.go's ProviderEntry.Auth), not a per-turn one — there is exactly one
# key this scenario will ever accept, for the life of the process, and a
# consumer wires its own rotation source to produce this exact string.
# `x-api-key`, `Authorization: Bearer` and Tavily's `body:api_key` placements
# — whichever a route accepts by default — all compare against it; see
# docs/scenario-schema.md's "Credential placements" table for which routes
# accept which.
#
# TRAP: do not combine `expect_key` with a fault plan. An auth rejection is
# raised before turn selection and never sets FaultEligible — see
# provider/handle.go's ordering and scenario-schema.md's "What claims a call
# index, and what does not" — so a REJECTED call never claims an attempt from
# a fault plan written next to `expect_key`. The plan's first attempt is
# consumed by the first AUTHENTICATED call, not the first call a client
# happens to send; a plan authored assuming otherwise fires one call later
# than its author expected. See docs/troubleshooting.md, and the pinned
# regression test scenarios/scenarios_test.go's
# TestCredentialRotation_ExpectKeyPlusFaultPlanFiresOnFirstAuthenticatedCall.
# This file declares no fault plan anywhere, which is the only way to
# sidestep the trap rather than trip over it.
#
# Both journal entries — the rejected call and the accepted one — carry only
# fingerprints; the journal never holds a credential value at all (house rule
# 4), which is what `AssertDifferentCredential`/`AssertSameCredential`
# compare instead.
#
# Coverage: all six provider blocks, sync and async alike, each with its own
# `auth:` — the async surfaces' create AND poll routes share one entry-level
# policy, exactly as `unauthorized` demonstrates for `mode: reject`.
version: 1
name: credential-rotation
description: >-
  Every provider requires the fixed key rotated-key-EXAMPLE; any other
  credential is the vendor's own 401, so a consumer proves its client
  actually rotates rather than retries with the key it already had.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.

providers:

  exa:
    auth:
      expect_key: rotated-key-EXAMPLE
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a
    # /contents and /findSimilar are governed by the same block-level auth —
    # `auth:` is a property of the whole exa entry, not of /search alone.
    find_similar:
      results:
        - source: source-a

  tavily:
    auth:
      expect_key: rotated-key-EXAMPLE
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98
    # /extract is governed by the same block-level auth; no `extract:` block
    # is needed to prove that, since /search's results above are enough.

  perplexity:
    auth:
      expect_key: rotated-key-EXAMPLE
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    # Keyed independently of Sonar, exactly as `unauthorized` keys its own
    # rejection independently: the two surfaces are separate provider
    # entries, so a migration test can rotate one while the other still runs
    # its old key.
    auth:
      expect_key: rotated-key-EXAMPLE
    answer: Report A states the finding.
    search_results:
      - source-a

  exa_agent_runs:
    auth:
      expect_key: rotated-key-EXAMPLE
    status: completed
    output:
      text: Report A states the finding.
    cost_dollars:
      total: 0.045

  tavily_research:
    auth:
      expect_key: rotated-key-EXAMPLE
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # mcp's own AuthPolicy default is optional (contracts/mcp/README.md
  # decision 3, the opposite default from the other five entries above), so
  # `expect_key` alone is not enough here: `mode: required` must be explicit,
  # or a missing credential would be accepted rather than rejected.
  mcp:
    auth:
      mode: required
      expect_key: rotated-key-EXAMPLE
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
