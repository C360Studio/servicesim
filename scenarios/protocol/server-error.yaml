# A permanent 500 on every surface.
#
# `after: repeat_last` is the point: the failure never heals, so a consumer that
# retries forever hangs its own test rather than accidentally passing on the
# second attempt. A 500 must be surfaced as an upstream failure, never mistaken
# for an empty result set.
version: 1
name: server-error
description: >-
  Every surface answers 500 in its own error envelope, permanently.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.

providers:

  exa:
    fault:
      after: repeat_last
      attempts:
        - status: 500
          error: Internal server error.
          tag: INTERNAL
    results:
      - source: source-a
    answer:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.
            tag: INTERNAL
      answer: Report A states the finding.
      citations:
        - source-a
    # Own budgets, own permanent 500s: a retry of /contents or /findSimilar
    # must not be answered from /search's or /answer's counters.
    contents:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.
            tag: INTERNAL
    find_similar:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.
            tag: INTERNAL
      results:
        - source: source-a

  tavily:
    fault:
      after: repeat_last
      attempts:
        - status: 500
          error: Internal server error.
    answer: A short synthesis of Report A.
    results:
      - source: source-a
        score: 0.98
    # /extract's own permanent 500, on its own budget.
    extract:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.

  perplexity:
    fault:
      after: repeat_last
      attempts:
        - status: 500
          error: Internal server error.
    answer: A grounded answer citing Report A.
    search_results:
      - source-a

  perplexity_agent:
    fault:
      after: repeat_last
      attempts:
        - status: 500
          error: Internal server error.
    answer: Report A states the finding.
    search_results:
      - source-a

  # The failure is on the CREATE: a run never gets minted, so there is nothing
  # to poll. `create.fault` is the only plan an async entry needs to express
  # "this surface is permanently down" — the poll turn below is declared only
  # because every built-in must carry one.
  exa_agent_runs:
    create:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.
            tag: INTERNAL
    status: completed
    output:
      text: Report A states the finding.

  tavily_research:
    create:
      fault:
        after: repeat_last
        attempts:
          - status: 500
            error: Internal server error.
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # One route, one permanent budget — no create/poll split, unlike the async
  # surfaces above.
  mcp:
    fault:
      after: repeat_last
      attempts:
        - status: 500
          error: Internal server error.
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
