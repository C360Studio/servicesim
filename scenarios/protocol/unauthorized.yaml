# Every provider rejects the presented credential with its own 401 envelope.
#
# The projections below are never rendered: auth runs before projection. They
# are declared anyway so that flipping one `mode: reject` to `required` turns
# this file into a working scenario, which is what makes it useful for testing
# the transition from a failed auth to a successful one.
version: 1
name: unauthorized
description: >-
  A 401 in each vendor's own error envelope, so a consumer surfaces an auth
  failure and does not retry it.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.

providers:

  exa:
    auth:
      mode: reject
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a
    # /contents and /findSimilar are never rendered either — `auth:` is a
    # property of the whole exa entry, so it rejects every route this listener
    # serves, not just /search. find_similar's results are declared anyway, for
    # the same reason answer's content is above: flipping mode: reject to
    # required turns this file into a working scenario for every route at once.
    find_similar:
      results:
        - source: source-a

  tavily:
    auth:
      mode: reject
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98
    # /extract is rejected by the same block-level auth; no `extract:` block
    # is needed to prove that, since D-a would resolve it from results above.

  perplexity:
    auth:
      mode: reject
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    # Keyed independently of Sonar: a consumer's migration fallback is tested by
    # rejecting one surface while the other stays healthy, and that is only
    # expressible because the two are separate provider entries.
    auth:
      mode: reject
    answer: Report A states the finding.
    search_results:
      - source-a

  exa_agent_runs:
    auth:
      mode: reject
    status: completed
    output:
      text: Report A states the finding.

  tavily_research:
    auth:
      mode: reject
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # mode: reject is explicit, so it overrides mcp's own optional-by-default
  # AuthPolicy exactly as it overrides the other five providers' default —
  # every credential is rejected with the fixed 401 shape (contracts/mcp/
  # README.md decision 3), never the ordinary 200 below.
  mcp:
    auth:
      mode: reject
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
