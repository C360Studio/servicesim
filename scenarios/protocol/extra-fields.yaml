# Additive, undocumented response fields on every surface.
#
# Real vendor APIs evolve additively, and a consumer that decodes strictly will
# start failing on a field it never asked for. Fields are added at two levels —
# the top-level envelope and the individual result entry — because a decoder
# often tolerates one and rejects the other.
version: 1
name: extra-fields
description: >-
  Well-formed 200s carrying additional unknown properties, so a consumer proves
  its decoder tolerates a vendor adding fields.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  exa:
    extra_fields:
      resolvedSearchType: neural
      experimentalRanking:
        variant: b
        weights:
          - 0.4
          - 0.6
    results:
      - source: source-a
        extra_fields:
          relevanceExplanation: An unreleased field describing why this ranked first.
          verified: true
    cost_dollars:
      total: 0.005
    answer:
      extra_fields:
        synthesisModel: an-unreleased-model-name
      answer: Report A states the finding.
      citations:
        - source-a
    # /contents' own envelope-level extra fields; its per-result tolerance is
    # already covered by results[].extra_fields above, since D-a resolves
    # /contents against this same results list.
    contents:
      extra_fields:
        crawlEngineVersion: unreleased-3
    # /findSimilar has its own results list (D-b), so it needs its own
    # result-level extra_fields to prove the same per-result tolerance.
    find_similar:
      results:
        - source: source-a
          extra_fields:
            relevanceExplanation: An unreleased field describing why this ranked first.
      extra_fields:
        experimentalRanking:
          variant: b

  tavily:
    extra_fields:
      request_region: eu-west
      experimental_rerank: true
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98
        extra_fields:
          chunk_count: 3
          experimental_relevance: 0.77
    # /extract's own envelope-level extra fields, independent of /search's
    # top-level extra_fields above — the same relationship AnswerProjection's
    # ExtraFields has to Exa's. Per-result tolerance is already covered by
    # results[].extra_fields above, since D-a resolves /extract from the same
    # results list.
    extract:
      extra_fields:
        experimental_extraction_model: unreleased-model-x

  perplexity:
    extra_fields:
      experimental_reasoning_trace: An unreleased field carrying free text.
      service_tier: default
    answer: A grounded answer citing Report A.
    finish_reason: stop
    citations:
      - source-a
    search_results:
      - source-a

  perplexity_agent:
    extra_fields:
      experimental_trace_id: trace-0
      service_tier: default
    answer: Report A states the finding.
    search_results:
      - source-a

  exa_agent_runs:
    status: completed
    output:
      text: Report A states the finding.
      grounding:
        - field: answer
          citations:
            - source-a
          confidence: high
    cost_dollars:
      total: 0.005
    extra_fields:
      experimental_trace_id: trace-0
      service_tier: default

  tavily_research:
    status: completed
    content: Report A states the finding.
    sources:
      - source-a
    extra_fields:
      experimental_relevance: 0.77
      service_tier: default

  # extra_fields here is merged into every result this profile renders —
  # server/discover, tools/list and tools/call alike (render.go's own doc
  # comment on Projection.ExtraFields) — so one block proves tolerance across
  # all three methods at once, unlike the other providers above, which need a
  # dedicated extra_fields per route. This is envelope-level only: neither
  # ToolProjection nor ContentBlock has an extra_fields field of its own, so
  # this file's "two levels" property (envelope AND per-entry) is not
  # expressible on MCP in this unit — a gap, not a choice, recorded here
  # rather than silently matched by adding an unrequested field.
  mcp:
    extra_fields:
      experimentalRanking: b
      serviceTier: default
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
