# A run/task on each async surface that reaches a terminal FAILED status
# instead of completing: Exa's agent run, Tavily's research task, and the
# Perplexity Agent's `background: true` run.
#
# The four synchronous surfaces stay in the ordinary happy shape — this file
# is about the async lifecycle, not about anything those four surfaces do
# differently — so only the two async entries below, and the background block
# of the perplexity_agent entry, diverge from `happy`.
version: 1
name: async-failed
description: >-
  A well-formed 200 from every synchronous surface, and a run/task on each
  async surface that reaches a terminal failed status — Exa's run is
  `status: failed` with `stopReason: error` and no error object (the live
  schema has none); Tavily's failed poll carries none either, which a
  consumer's failure branch must handle too; a Perplexity `background: true`
  run's retrieves answer queued, then in_progress, then `status: failed` with
  an `error` object and the usage and cost the failed run billed.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  # This file is about the async lifecycle; /contents, /findSimilar and
  # /extract are left to their D-a/D-b defaults, unexercised.
  exa:
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a

  tavily:
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98

  perplexity:
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. Sixteen built-ins share one block that completes;
    # this is one of the four that script their own, because a run that completed here
    # would break this file's promise on the route a background poll uses. A job's
    # retrieves are queued, then in progress, then failed for good. The failed
    # snapshot carries `error`, the specification's ErrorInfo (message required; code
    # and type are free strings the vendor does not enumerate, so these values are
    # Servicesim's, the same ones perplexity-agent-failed.json carries), and no
    # message item. It also carries the usage and cost the run billed before it failed:
    # a failed run still bills, here 24 output tokens at the completed run's rate. The
    # create still answers the fixed queued stub; this block scripts only the
    # retrieves. It carries no fault on purpose: this entry's own `fault:` or `turns:`
    # shape the CREATE, and the retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - when: {call_index: 1}
          respond:
            status: in_progress
        - respond:
            status: failed
            error:
              code: model_error
              message: The background run failed before it could answer.
              type: server_error
            usage:
              input_tokens: 24
              output_tokens: 24
              cost:
                input_cost: 0.0001
                output_cost: 0.0001

  # One running poll, then a terminal FAILED status. The live AgentRun schema
  # has no run-level error object, so a failed run is expressed through its
  # status and stopReason alone — declaring an `error:` block is a load ERROR
  # (exa.agent_run.error.not_in_schema).
  #
  # stop_reason is not declared: agentRunProjection.EffectiveStopReason derives
  # "error" for any failed run automatically, so writing it here would only
  # restate what the code already does.
  exa_agent_runs:
    turns:
      - when: {call_index: 0}
        respond: {status: running}
      - respond:
          status: failed
          cost_dollars:
            total: 0.01
    # A cancel is acknowledged as still running, since an acknowledgement is not
    # proof billing stopped, and the polls after it confirm `cancelled`, billing the
    # usage the run accrued before it.
    cancel:
      turns:
        - when: {call_index: 0}
          respond: {status: running}
        - respond:
            status: cancelled
            usage:
              agent_compute_units: 3
              searches: 2
            cost_dollars:
              total: 0.012

  # Tavily documents no distinct error shape for a failed task, and — per the
  # vendor's research-get reference, re-verified 2026-08-15 (see
  # contracts/tavily/README.md) — a failed poll carries ONLY the three common
  # fields (request_id, status, response_time); `content` and `sources` are
  # gated on `completed` alone, not on every terminal status the way an
  # earlier reading of this file assumed. There is nowhere on this surface for
  # a failed task to say what went wrong; a consumer's failure branch has the
  # status code and nothing else to read.
  tavily_research:
    turns:
      - when: {call_index: 0}
        respond: {status: pending}
      - respond:
          status: failed

  # This file's failure story is about the two async surfaces; mcp stays in
  # the ordinary happy shape, exactly as the other four synchronous surfaces
  # above do.
  mcp:
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
