# A run/task on each async surface that reaches a terminal FAILED status
# instead of completing.
#
# The four synchronous surfaces stay in the ordinary happy shape — this file
# is about the async lifecycle, not about anything those four surfaces do
# differently — so only the two async entries below diverge from `happy`.
version: 1
name: async-failed
description: >-
  A well-formed 200 from every synchronous surface, and a run/task on each
  async surface that reaches a terminal failed status — Exa's `error` object
  carries the detail; Tavily's failed poll carries none, which a consumer's
  failure branch must handle too.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  # This file is about the async lifecycle; /contents, /findSimilar and
  # /extract are left to their D-a/D-b defaults, unexercised.
  exa:
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a

  tavily:
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98

  perplexity:
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    answer: Report A states the finding.
    search_results:
      - source-a

  # One running poll, then a terminal FAILED status carrying the required
  # error object — a failed run with no error is a load ERROR
  # (exa.agent_run.failed_without_error), because a consumer's failure branch
  # is exactly what this scenario exists to exercise.
  #
  # stop_reason is not declared: AgentRunProjection.EffectiveStopReason derives
  # "error" for any failed run automatically, so writing it here would only
  # restate what the code already does.
  exa_agent_runs:
    turns:
      - when: {call_index: 0}
        respond: {status: running}
      - respond:
          status: failed
          error:
            code: AGENT_RUN_FAILED
            message: The run could not be completed.

  # Tavily documents no distinct error shape for a failed task, and — per the
  # vendor's research-get reference, re-verified 2026-08-15 (see
  # contracts/tavily/README.md) — a failed poll carries ONLY the three common
  # fields (request_id, status, response_time); `content` and `sources` are
  # gated on `completed` alone, not on every terminal status the way an
  # earlier reading of this file assumed. There is nowhere on this surface for
  # a failed task to say what went wrong; a consumer's failure branch has the
  # status code and nothing else to read.
  tavily_research:
    turns:
      - when: {call_index: 0}
        respond: {status: pending}
      - respond:
          status: failed
