# A 200 whose body is not valid JSON.
#
# The bytes are a truncated object rather than random noise: a decoder that
# reads the prefix optimistically and returns zero values on the error is the
# failure this scenario is looking for, and a body that fails at the first byte
# would not find it. `after: repeat_last` keeps every retry malformed too.
version: 1
name: malformed-json
description: >-
  Every surface answers 200 with a body that is not valid JSON (an Exa
  agent-run cancel and a Perplexity background retrieve and cancel, each on
  its own budget, are not faulted here, but a `background: true` create gets
  the same invalid body and so mints nothing to retrieve or cancel), so a consumer fails cleanly
  instead of panicking or silently returning zero values.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.

providers:

  exa:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"requestId":"00000000000000000000000000000000","results":[{"title":"Report A",'
    results:
      - source: source-a
    answer:
      fault:
        after: repeat_last
        attempts:
          - kind: invalid_json
            status: 200
            raw_body: '{"answer":"Report A states the finding","citations":['
      answer: Report A states the finding.
      citations:
        - source-a
    # /contents and /findSimilar each get their own always-on truncated body,
    # on their own fault budgets, so a retry of either stays malformed too.
    contents:
      fault:
        after: repeat_last
        attempts:
          - kind: invalid_json
            status: 200
            raw_body: '{"requestId":"00000000000000000000000000000000","results":[{"title":"Report A",'
    find_similar:
      fault:
        after: repeat_last
        attempts:
          - kind: invalid_json
            status: 200
            raw_body: '{"requestId":"00000000000000000000000000000000","results":[{"title":"Report A",'
      results:
        - source: source-a

  tavily:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"query":"report a","results":[{"title":"Report A",'
    answer: A short synthesis of Report A.
    results:
      - source: source-a
        score: 0.98
    # /extract's own always-on truncated body, on its own budget.
    extract:
      fault:
        after: repeat_last
        attempts:
          - kind: invalid_json
            status: 200
            raw_body: '{"results":[{"url":"https://example.test/report-a",'

  perplexity:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"id":"cmpl-0","choices":[{"index":0,"message":{'
    answer: A grounded answer citing Report A.
    search_results:
      - source-a

  perplexity_agent:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"id":"resp_0","object":"response","output":[{"type":"message",'
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. A job's retrieves are queued, then in progress,
    # then completed for good, with the usage and cost the run billed. The block is
    # shared by sixteen built-ins (four script their own) and carries no fault on purpose: this entry's own
    # `fault:` or `turns:` shape the CREATE, and the retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - when: {call_index: 1}
          respond:
            status: in_progress
        - respond:
            status: completed
            answer: The background run has completed.
            usage:
              input_tokens: 24
              output_tokens: 96
              cost:
                input_cost: 0.0001
                output_cost: 0.0004
      # A cancel is answered `cancelling`, and the retrieves after it read in progress,
      # since an acknowledgement is not proof the run stopped, and then cancelled,
      # billing the usage the run accrued before it stopped: its 24 input tokens and
      # 12 output tokens, at the per-token rates of the corpus's completed run.
      # Nineteen built-ins share this cancel block (extra-fields scripts its own). A
      # cancel made once the run has ended, when its next retrieve would be terminal,
      # is the vendor's 400 and records nothing. It carries no fault on purpose: the
      # cancel's budget is its own. The total_cost is scripted rather than left to the
      # renderer, whose float sum of the two costs would print 0.00015000000000000001.
      cancel:
        turns:
          - when: {call_index: 0}
            respond:
              status: in_progress
          - respond:
              status: cancelled
              usage:
                input_tokens: 24
                output_tokens: 12
                cost:
                  input_cost: 0.0001
                  output_cost: 0.00005
                  total_cost: 0.00015

  # The block-level `fault:` on an async entry with no `turns:` covers the POLL
  # route (create.fault is a separate, undeclared budget here), which is what
  # the create/poll route split makes possible: the create still succeeds, and
  # every poll after it comes back truncated.
  exa_agent_runs:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"id":"agent_run_00000000000000000000000000000000","status":"completed","output":{'
    status: completed
    output:
      text: Report A states the finding.
    cost_dollars:
      total: 0.045

  tavily_research:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"request_id":"00000000-0000-0000-0000-000000000000","status":"completed",'
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # One route, one always-on truncated body, on its own budget.
  mcp:
    fault:
      after: repeat_last
      attempts:
        - kind: invalid_json
          status: 200
          raw_body: '{"jsonrpc":"2.0","id":1,"result":{"resultType":"complete","content":[{"type":"text",'
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
