# A scripted agentic loop on the Perplexity Agent surface.
#
# This is the multi-turn form. Turns are matched in declaration order and the
# first whose `when` matches wins, so the unconditional fallback must come last.
# Nothing here is generated: every response is scripted, and the predicate only
# ever reads the request and the call counter.
#
# The other three providers use the single-shot form, which is the same thing
# normalised into one unconditional turn — one --scenario flag still configures
# every listener coherently.
#
# `turn_key` is left at its default of ["route"], which is one sequence per
# route and is correct for a single serial caller. A suite that fans one route
# out across concurrent agent roles must set it — for example
# `turn_key: ["route", "header:x-role"]` — or two roles will draw call indices
# from the same sequence and each receive the other's turn.
version: 1
name: conversation
description: >-
  Three scripted turns on POST /v1/agent — search, answer once the tool result
  comes back, then a fallback — matched by call index, by body substring and
  unconditionally.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  # This file's script is about the Perplexity Agent's multi-turn form; /contents,
  # /findSimilar and /extract are left to their D-a/D-b defaults, unexercised.
  exa:
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a

  tavily:
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98

  perplexity:
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    auth:
      mode: required
    turns:

      # Call 0: the agent has nothing yet, so it reports the search it ran and
      # returns no results. Matched by call index rather than by prompt text,
      # which is what makes it survive a reworded prompt.
      - when:
          call_index: 0
        respond:
          answer: Searching for Report A.
          queries:
            - report a
          search_results: []

      # The follow-up call carries the tool result, which names the document.
      # BodyContains is crude on purpose: it answers "which tool result came
      # back" without becoming an expression language.
      - when:
          body_contains: report-a
        respond:
          answer: Report A states the finding.
          queries:
            - report a
          search_results:
            - source-a
          annotations:
            - source: source-a
              start_index: 0
              end_index: 8
          usage:
            input_tokens: 48
            output_tokens: 64
            cost:
              input_cost: 0.0002
              output_cost: 0.0003

      # No `when`, so it matches anything. An unmatched request is never
      # silently a 200 elsewhere; this turn is what makes the loop terminate
      # rather than dead-end.
      - respond:
          status: incomplete
          answer: No further information.

  # This file's script is about the Perplexity Agent's multi-turn form; the
  # happy shape here is just a coherent async surface so one --scenario flag
  # still configures every listener.
  exa_agent_runs:
    turns:
      - when: {call_index: 0}
        respond:
          status: running
      - when: {call_index: 1}
        respond:
          status: running
      - respond:
          status: completed
          output:
            text: Report A states the finding.
            grounding:
              - field: answer
                citations:
                  - source-a
                confidence: high
          cost_dollars:
            total: 0.045

  tavily_research:
    turns:
      - when: {call_index: 0}
        respond: {status: pending}
      - when: {call_index: 1}
        respond: {status: in_progress}
      - respond:
          status: completed
          content: Report A states the finding.
          sources:
            - source-a

  # This file's script is about the Perplexity Agent's multi-turn form; mcp
  # stays in the ordinary single-shot happy shape.
  mcp:
    # A turn IS a server state (contracts/mcp/README.md's own framing;
    # docs/scenario-schema.md "### mcp"): unlike the single-shot blocks
    # elsewhere in this file, this one scripts tool-catalogue drift between
    # calls as turn N vs turn N+1, the worked example the docs otherwise
    # only describe. `turn_key` is left at its default of ["route"].
    turns:
      # Call 0: the catalogue before the server picks up a second tool —
      # `search` only.
      - when:
          call_index: 0
        respond:
          instructions: Search the evaluation corpus for relevant reports.
          tools:
            - name: search
              description: Search the evaluation corpus for relevant reports.
              input_schema:
                type: object
                properties:
                  query: {type: string}
                required: [query]
          results:
            search:
              content:
                - type: text
                  source: source-a

      # Call 1 onward: the server now also advertises search_deep. A client
      # that cached tools/list from call 0 and never re-requested it would
      # not see this — exactly the staleness ttlMs (decision 9) bounds.
      - respond:
          instructions: Search the evaluation corpus for relevant reports.
          tools:
            - name: search
              description: Search the evaluation corpus for relevant reports.
              input_schema:
                type: object
                properties:
                  query: {type: string}
                required: [query]
            - name: search_deep
              description: A deeper search added after the server's first response.
              input_schema:
                type: object
                properties:
                  query: {type: string}
                required: [query]
          results:
            search:
              content:
                - type: text
                  source: source-a
            search_deep:
              content:
                - type: text
                  source: source-a
