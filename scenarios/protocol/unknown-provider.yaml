# A provider this build has no handler for, declared alongside five it does.
#
# Loading and validating this file MUST succeed. The `openai` block yields a
# warning naming the unimplemented provider and is otherwise ignored, while the
# implemented providers serve normally. That policy exists for one concrete
# reason: a scenario file shared across repositories must not break the moment
# one consumer pins an older Servicesim that has not learned the new provider
# yet. One team's upgrade breaking another team's suite costs far more than
# ignoring a block nobody can serve.
#
# The block is written in the multi-turn form on purpose. It is what an LLM
# script looks like, so this file also documents the shape a future provider
# would arrive in — no schema change required.
version: 1
name: unknown-provider
description: >-
  Four implemented providers plus an unimplemented one, proving that an
  unrecognised provider name is a warning and never a load failure.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    author: A. Author
    published_at: 2026-05-20T00:00:00Z
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  # This file is about an unrecognised provider name; /contents, /findSimilar
  # and /extract are left to their D-a/D-b defaults, unexercised.
  exa:
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      answer: Report A states the finding.
      citations:
        - source-a

  tavily:
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98

  perplexity:
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. A job's retrieves are queued, then in progress,
    # then completed for good, with the usage and cost the run billed. The block is
    # shared by sixteen built-ins (four script their own) and carries no fault on purpose: this entry's own
    # `fault:` or `turns:` shape the CREATE, and the retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - when: {call_index: 1}
          respond:
            status: in_progress
        - respond:
            status: completed
            answer: The background run has completed.
            usage:
              input_tokens: 24
              output_tokens: 96
              cost:
                input_cost: 0.0001
                output_cost: 0.0004

  # This file is about an unrecognised provider name; the happy shape here is
  # just a coherent async surface so one --scenario flag still configures
  # every listener. Single-shot, like the four blocks above it: the test
  # asserting the implemented providers are untouched holds every one of them
  # to that same one-turn shape.
  exa_agent_runs:
    status: completed
    output:
      text: Report A states the finding.
      grounding:
        - field: answer
          citations:
            - source-a
          confidence: high
    cost_dollars:
      total: 0.045

  tavily_research:
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # This file is about an unrecognised provider name; mcp is a fifth
  # implemented provider, served exactly like the four synchronous ones
  # above and single-shot like every block in this file.
  mcp:
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a

  # No handler in this build. The body is never decoded — the scenario package
  # leaves every projection undecoded, and no provider package claims this name.
  openai:
    turns:
      - when:
          call_index: 0
        respond:
          tool_calls:
            - name: search
              arguments:
                query: report a
      - when:
          body_contains: report-a
        respond:
          content: Report A states the finding.
          citations:
            - source-a
      - respond:
          content: I don't know.
