# One 429 carrying Retry-After, then success.
#
# The trailing `- status: 200` attempt is a fault of kind none: it serves the
# scenario response. That is what makes this scenario assert two things at once
# — that a consumer backs off and retries, and that the retry is counted rather
# than restarting the plan.
version: 1
name: rate-limited
description: >-
  Every surface answers 429 with Retry-After once, then serves its ordinary
  response (an Exa agent-run cancel and a Perplexity background retrieve, each
  on its own budget, are not faulted here, while a `background: true` create
  draws the Agent create's 429), so backoff, retry and attempt counting are
  all exercised.

time:
  base: 2026-01-01T00:00:00Z

sources:
  - id: source-a
    url: https://example.test/report-a
    title: Report A
    text: Full source text of Report A.
    snippets:
      - A relevant excerpt from Report A.

providers:

  exa:
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
          tag: RATE_LIMIT
        - status: 200
    results:
      - source: source-a
    cost_dollars:
      total: 0.005
    answer:
      # /answer is a separate route with its own attempt budget, so it needs its
      # own plan; a single block-level fault would leave it healthy.
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
            tag: RATE_LIMIT
          - status: 200
      answer: Report A states the finding.
      citations:
        - source-a
    # /contents and /findSimilar are separate routes too (exa:contents,
    # exa:find_similar), each with its own retry budget independent of /search
    # and /answer's above.
    contents:
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
            tag: RATE_LIMIT
          - status: 200
    find_similar:
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
            tag: RATE_LIMIT
          - status: 200
      results:
        - source: source-a

  tavily:
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    answer: A short synthesis of Report A.
    response_time: 1.15
    results:
      - source: source-a
        score: 0.98
    # /extract draws on its own budget (tavily:extract), independent of
    # /search's above.
    extract:
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
          - status: 200

  perplexity:
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    answer: A grounded answer citing Report A.
    finish_reason: stop
    search_results:
      - source-a

  perplexity_agent:
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    answer: Report A states the finding.
    search_results:
      - source-a
    # The background lifecycle: what `background: true` on POST /v1/agent starts and
    # GET /v1/agent/{id} retrieves. A job's retrieves are queued, then in progress,
    # then completed for good, with the usage and cost the run billed. The block is
    # shared by sixteen built-ins (four script their own) and carries no fault on purpose: this entry's own
    # `fault:` or `turns:` shape the CREATE, and the retrieve's budget is its own.
    background:
      turns:
        - when: {call_index: 0}
          respond:
            status: queued
        - when: {call_index: 1}
          respond:
            status: in_progress
        - respond:
            status: completed
            answer: The background run has completed.
            usage:
              input_tokens: 24
              output_tokens: 96
              cost:
                input_cost: 0.0001
                output_cost: 0.0004

  # Two routes, two budgets: `create.fault` covers POST /agent/runs and the
  # block-level `fault:` covers the poll, exactly as the design's §2.5 two
  # independent counters require. The poll's declared "- status: 200" is a
  # fault of kind none — it does not override what the handler renders, it
  # only marks the attempt as unfaulted, and a completed poll always renders
  # 200 anyway.
  #
  # The agent routes answer errors as {error: {type, code, message}}: `error:`
  # becomes the message and `tag:` would become the code. No tag is declared
  # because a 429 already defaults to RATE_LIMIT_ERROR / CONCURRENCY_LIMIT_REACHED.
  exa_agent_runs:
    create:
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
          - status: 200
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    status: completed
    output:
      text: Report A states the finding.
    cost_dollars:
      total: 0.005

  # Same shape on the research surface. The poll's "- status: 200" attempt
  # happens to match what a completed task really answers (200), but that is
  # a property of THIS scenario reaching completed, not something the fault
  # attempt enforces.
  tavily_research:
    create:
      fault:
        attempts:
          - status: 429
            retry_after: 1
            error: Rate limit exceeded.
          - status: 201
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    status: completed
    content: Report A states the finding.
    sources:
      - source-a

  # One route, one budget: unlike the two async surfaces above, POST /mcp has
  # no separate create route, so a single plan covers it.
  mcp:
    fault:
      attempts:
        - status: 429
          retry_after: 1
          error: Rate limit exceeded.
        - status: 200
    instructions: Search the evaluation corpus for relevant reports.
    tools:
      - name: search
        description: Search the evaluation corpus for relevant reports.
        input_schema:
          type: object
          properties:
            query: {type: string}
          required: [query]
    results:
      search:
        content:
          - type: text
            source: source-a
