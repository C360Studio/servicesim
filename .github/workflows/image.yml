name: Publish Image

on:
  # Publish `latest` only after CI passes on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Version tags publish immediately; CI is expected to have passed before tagging.
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: c360studio/servicesim

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.title=Servicesim
            org.opencontainers.image.description=Deterministic HTTP simulator for the Exa, Tavily and Perplexity research APIs
            org.opencontainers.image.vendor=C360
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.event.workflow_run.head_sha || github.sha }}
            COMMIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
            BUILD_DATE=${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp }}

      - name: Image digest
        # Release-critical consumer CI is expected to pin this digest.
        run: echo "Published with digest ${{ steps.build.outputs.digest }}"

  report-skipped:
    name: Report CI Failed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Report CI failure
        run: |
          echo "Image publish skipped because the CI workflow failed."
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "See: ${{ github.event.workflow_run.html_url }}"
