name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Sanity-check revive version matches go.mod pin
        # revive is pinned through go.mod's `tool` directive (Go 1.24+), so a
        # new upstream release cannot surprise CI with new ruleset warnings.
        # This step catches the case where setup-go's module cache serves a
        # binary that does not match the current pin, turning silent drift into
        # a loud failure.
        run: |
          expected=$(awk '/github.com\/mgechev\/revive v/ {print $2}' go.mod | head -1)
          actual_raw=$(go tool revive --version 2>&1 | head -1 | awk '{print $NF}')
          expected="${expected#v}"
          actual="${actual_raw#v}"
          if [ "$expected" != "$actual" ]; then
            echo "FAIL: revive version mismatch — go.mod pin: $expected, go tool raw: $actual_raw (normalized: $actual)"
            exit 1
          fi
          echo "OK: revive $actual matches go.mod pin"

      - name: Run revive (warnings fail)
        run: go tool revive -config revive.toml -formatter friendly ./...

      - name: Guard — no real provider hostnames in fixtures or scenarios
        # Servicesim must never be one typo away from sending a test's traffic
        # to a paid API. Scenario and fixture data may only reference reserved
        # example domains.
        run: bash scripts/lint-no-live-hosts.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...

      - name: Report coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./... >/dev/null
          go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${{ github.sha }}" \
            -o servicesim-linux-amd64 \
            ./cmd/servicesim

      - name: Verify binary reports its version
        run: ./servicesim-linux-amd64 --version

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: servicesim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — non-root, healthy, all listeners answer
        # Acceptance criteria 2, 10 and 12 are asserted here rather than
        # claimed in a document: the image must run as a non-root user, report
        # healthy on the admin port, serve each provider on its own port, and
        # fail closed on an unmatched route.
        run: bash scripts/image-smoke.sh servicesim:ci

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, build, image]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.image.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
